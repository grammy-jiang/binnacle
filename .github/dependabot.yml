version: 2

updates:
  # Python/runtime/development dependencies are intentionally reviewed as
  # individual changes because pyproject.toml treats runtime dependency changes
  # as architectural decisions rather than incidental lockfile churn.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "Australia/Sydney"
    # Version updates only: security fixes remain immediate.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # Remote hook revisions are one repository-quality surface, so a single weekly
  # PR is easier to review against the all-files pre-commit gate. Project Python
  # tools (Ruff, Bandit, uv) are local hooks and are owned by the uv ecosystem.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:15"
      timezone: "Australia/Sydney"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      repository-hooks:
        patterns:
          - "*"

  # Actions are SHA-pinned in workflows. Dependabot retains that pinning while
  # updating the referenced action version.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:30"
      timezone: "Australia/Sydney"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      workflow-actions:
        patterns:
          - "*"
