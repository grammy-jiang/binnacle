name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync development dependencies
        run: uv sync --locked --group dev

      - name: Run code-quality gates
        run: uv run pre-commit run --all-files

  tests:
    name: Tests / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            tox-env: py310
          - python: "3.11"
            tox-env: py311
          - python: "3.12"
            tox-env: py312
          - python: "3.14"
            tox-env: py314

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.7"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install ripgrep
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: ripgrep

      - name: Sync development dependencies
        run: uv sync --locked --group dev

      - name: Prepare Binnacle test host
        run: |
          mkdir -p "$HOME/.config/binnacle"
          printf 'Bearer ci-test-token\n' > "$HOME/.config/binnacle/token"
          chmod 600 "$HOME/.config/binnacle/token"
          repo_parent=$(dirname "$GITHUB_WORKSPACE")
          printf '[roots]\ndefault_root = "%s"\nextra_roots = ["/tmp"]\n'             "$repo_parent" > "$HOME/.config/binnacle/config.toml"

      - name: Run test suite
        run: uv run tox -e ${{ matrix.tox-env }} -- --ignore=tests/integration/test_wheel_artifact.py

  coverage:
    name: Coverage policy / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.7"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install ripgrep
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: ripgrep

      - name: Sync development dependencies
        run: uv sync --locked --group dev

      - name: Prepare Binnacle test host
        run: |
          mkdir -p "$HOME/.config/binnacle"
          printf 'Bearer ci-test-token\n' > "$HOME/.config/binnacle/token"
          chmod 600 "$HOME/.config/binnacle/token"
          repo_parent=$(dirname "$GITHUB_WORKSPACE")
          printf '[roots]\ndefault_root = "%s"\nextra_roots = ["/tmp"]\n'             "$repo_parent" > "$HOME/.config/binnacle/config.toml"

      - name: Enforce per-module branch coverage
        run: uv run tox -e coverage-policy -- --ignore=tests/integration/test_wheel_artifact.py
