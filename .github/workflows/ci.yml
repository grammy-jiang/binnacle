name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py312-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "uv.lock"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync development dependencies
        run: uv sync --locked --group dev

      - name: Run code-quality gates
        run: |
          uv run pre-commit run --all-files
          uv run pre-commit run gitleaks-history --hook-stage manual --all-files

  tests:
    name: Tests / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            tox-env: py310
          - python: "3.11"
            tox-env: py311
          - python: "3.12"
            tox-env: py312
          - python: "3.14"
            tox-env: py314

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "uv.lock"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install ripgrep (pinned, checksum verified)
        env:
          RG_VERSION: "15.2.0"
          RG_SHA256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
        run: |
          set -euo pipefail
          archive="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${archive}"
          echo "${RG_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" --strip-components=1 \
            "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg"
          install -m 0755 "$RUNNER_TEMP/rg" "$HOME/.local/bin/rg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rg" --version | head -1 | grep -F "ripgrep ${RG_VERSION}"

      - name: Sync development dependencies
        run: uv sync --locked --group dev

      - name: Prepare Binnacle test host
        run: |
          mkdir -p "$HOME/.config/binnacle"
          printf 'Bearer ci-test-token\n' > "$HOME/.config/binnacle/token"
          chmod 600 "$HOME/.config/binnacle/token"
          repo_parent=$(dirname "$GITHUB_WORKSPACE")
          printf '[roots]\ndefault_root = "%s"\nextra_roots = ["/tmp"]\n'             "$repo_parent" > "$HOME/.config/binnacle/config.toml"

      - name: Run test suite
        run: >-
          uv run tox -e ${{ matrix.tox-env }} --
          --ignore=tests/integration/test_wheel_artifact.py
          --seed 12345
          --junit-dir .quality-artifacts/pytest-${{ matrix.python }}
          --durations=15

      - name: Save failing test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-python-${{ matrix.python }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .quality-artifacts/pytest-${{ matrix.python }}/*.xml
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: Coverage policy / Python 3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "uv.lock"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install ripgrep (pinned, checksum verified)
        env:
          RG_VERSION: "15.2.0"
          RG_SHA256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
        run: |
          set -euo pipefail
          archive="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${archive}"
          echo "${RG_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" --strip-components=1 \
            "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg"
          install -m 0755 "$RUNNER_TEMP/rg" "$HOME/.local/bin/rg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rg" --version | head -1 | grep -F "ripgrep ${RG_VERSION}"

      - name: Sync development dependencies
        run: uv sync --locked --group dev

      - name: Prepare Binnacle test host
        run: |
          mkdir -p "$HOME/.config/binnacle"
          printf 'Bearer ci-test-token\n' > "$HOME/.config/binnacle/token"
          chmod 600 "$HOME/.config/binnacle/token"
          repo_parent=$(dirname "$GITHUB_WORKSPACE")
          printf '[roots]\ndefault_root = "%s"\nextra_roots = ["/tmp"]\n'             "$repo_parent" > "$HOME/.config/binnacle/config.toml"

      - name: Enforce per-module branch coverage
        run: >-
          uv run tox -e coverage-policy --
          --ignore=tests/integration/test_wheel_artifact.py
          --seed 12345
          --junit-dir .quality-artifacts/coverage
          --durations=15

      - name: Save failing coverage reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-3.13-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .quality-artifacts/coverage/*.xml
          if-no-files-found: warn
          retention-days: 7

  packaging:
    name: Packaging / Python 3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: "uv.lock"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Build and smoke distribution artifacts
        run: >-
          uv run --no-sync pytest -q tests/integration/test_wheel_artifact.py
          --randomly-seed=12345
