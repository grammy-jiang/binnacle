name: Contract validation

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Attest exact checkout identity with reviewed collector
        id: phase10-attestation
        uses: >-
          grammy-jiang/binnacle/.github/actions/phase10-checkout-attestation@668a3b69af386894a6eedcd740634589b6bb1ccc
        with:
          output: ${{ runner.temp }}/phase10-ci-checkout.json
          job-name: validate-contracts

      - name: Upload checkout attestation
        if: ${{ always() && steps.phase10-attestation.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            phase10-checkout-${{ github.run_id }}-contracts-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase10-ci-checkout.json
          if-no-files-found: error
          retention-days: 30

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          PyYAML==6.0.3 jsonschema==4.26.0

      - name: Check both generated MCP catalogue projections
        run: python scripts/compile_mcp_registry.py --check

      - name: Validate contracts
        run: python scripts/validate_contracts.py

      - name: Validate representative schema instances
        run: python scripts/validate_schema_instances.py
