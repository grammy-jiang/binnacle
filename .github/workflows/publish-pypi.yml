name: Publish PyPI

on:
  release:
    types: [published]

# Publishing is never triggered by ordinary pushes, PRs or Dependabot.
permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate release and build distributions
    if: ${{ github.repository == 'grammy-jiang/binnacle' && !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify annotated release tag, version and deployed branch
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          RELEASE_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$RELEASE_SHA" = "$(git rev-parse HEAD)"
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          test "$RELEASE_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          test "$RELEASE_SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/proof-of-concept" --jq '.object.sha')"
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          details = tomllib.loads(Path("pyproject.toml").read_text())
          version = details["project"]["version"]
          if details["project"]["name"] != "binnacle-mcp":
              raise SystemExit("Wrong package identity")
          if "v" + version != os.environ["RELEASE_TAG"]:
              raise SystemExit("Tag does not match distribution version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("version=" + version, file=output)
          print("Validated release version", version)
          PY

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: uv.lock
          python-version: "3.13"

      - name: Install locked test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Reconfirm required exact-SHA GitHub CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path
          from scripts.deploy_flow import ci_state
          from scripts.deploy_smoke import default_env

          state, detail = ci_state(default_env(checkout=Path.cwd()), os.environ["GITHUB_SHA"])
          print("Exact SHA GitHub CI:", state, detail)
          if state != "success":
              raise SystemExit("Required CI is not fully successful")
          PY

      - name: Verify isolated install from source distribution
        run: uv run --no-sync pytest -q tests/integration/test_wheel_artifact.py --randomly-seed=12345

      - name: Build wheel from the source distribution
        run: |
          set -euo pipefail
          uv build --no-sources --sdist --clear --out-dir dist \
            --build-constraint build-constraints.txt --require-hashes
          mapfile -t source_dist < <(find dist -maxdepth 1 -name '*.tar.gz' -type f)
          test "${#source_dist[@]}" -eq 1
          uv build --no-sources --wheel --out-dir dist \
            --build-constraint build-constraints.txt --require-hashes "${source_dist[0]}"
          test "$(find dist -maxdepth 1 -name '*.whl' -type f | wc -l)" -eq 1

      - name: Strict PyPI metadata validation and distribution checksums
        run: |
          set -euo pipefail
          uvx --from 'twine==6.2.0' twine check --strict dist/*.whl dist/*.tar.gz
          sha256sum dist/*.whl dist/*.tar.gz
          echo 'Verified wheel and source distribution' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve validated distributions for isolated OIDC publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binnacle-pypi-dists
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/binnacle-mcp/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Retrieve validated distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binnacle-pypi-dists
          path: dist

      - name: Publish through PyPI OIDC (no stored API token)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
