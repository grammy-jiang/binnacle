name: Python CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked environment
        run: uv sync --frozen --python "${{ matrix.python-version }}"

      - name: Run tests
        run: uv run --python "${{ matrix.python-version }}" pytest

  quality:
    name: Code, contract, dependency, and document quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked environment
        run: uv sync --frozen --python 3.13

      - name: Lint Python
        run: uv run ruff check .

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Type-check Python
        run: >-
          uv run mypy src/binnacle tests
          scripts/mcp_evaluation.py
          scripts/build_privileged_artifact_manifest.py
          scripts/setup_dev_pi.py
          scripts/verify_dev_pi.py
          scripts/verify_operation_kernel.py
          scripts/verify_execution_supervisor.py
          scripts/verify_git_credential_broker.py
          scripts/verify_privileged_broker.py

      - name: Enforce import boundaries
        run: uv run lint-imports

      - name: Audit locked dependencies
        run: uv run pip-audit

      - name: Lint reStructuredText documentation
        run: uv run rstcheck --recursive docs

      - name: Check generated MCP registry
        run: uv run python scripts/compile_mcp_registry.py --check

      - name: Validate contracts
        run: uv run python scripts/validate_contracts.py

      - name: Validate representative schema instances
        run: uv run python scripts/validate_schema_instances.py

      - name: Validate operational CLI entry points
        run: |
          uv run python scripts/mcp_evaluation.py --help
          uv run python scripts/build_privileged_artifact_manifest.py --help
          uv run python scripts/setup_dev_pi.py --help
          uv run python scripts/verify_dev_pi.py --help
          uv run python scripts/verify_operation_kernel.py --help
          uv run python scripts/verify_execution_supervisor.py --help
          uv run python scripts/verify_git_credential_broker.py --help
          uv run python scripts/verify_privileged_broker.py --help
          uv run binnacle db --help
          uv run binnacle kernel --help
          uv run binnacle audit --help
          uv run binnacle executor --help
          uv run binnacle-privileged-broker --help
          uv run binnacle-privileged-verify --help

      - name: Exercise isolated latest migration and read-only verification
        run: |
          uv run python scripts/verify_operation_kernel.py --temporary --output json
          uv run python scripts/verify_execution_supervisor.py --temporary --output json
          uv run python scripts/verify_git_credential_broker.py --temporary --output json
          uv run python scripts/verify_privileged_broker.py --temporary \
            --require-default-disabled --output json

      - name: Validate repository and documentation hygiene
        run: uv run pre-commit run --all-files
