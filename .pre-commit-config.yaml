# Managed with the manage-precommit skill -- https://pre-commit.com
# Bootstrap/sync hooks: uv run scripts/dev.py bootstrap
# Run on all files:      pre-commit run --all-files
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
exclude: '^\.gitignore$'
repos:
  # Base hygiene -- fast, universal checks from the pre-commit maintainers.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-case-conflict
      - id: check-symlinks
        always_run: true
      - id: destroyed-symlinks
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]
      - id: debug-statements
  # YAML linter -- config lives in the repo's .yamllint.yaml (copied by the skill).
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  # Markdown linter -- config lives in the repo's .markdownlint.yaml (copied by the skill).
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        # Reference corpora preserve source formatting; project prose is linted.
        exclude: ^\.claude/skills/.*/references/
  # Secret scanner -- blocks commits that contain credentials/tokens.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]
      - id: gitleaks
        alias: gitleaks-history
        name: Detect secrets in Git history
        entry: gitleaks git --redact --no-banner
        pass_filenames: false
        stages: [manual]
  # Ruff -- lint (with autofix) and format; official hook repo, rev kept in
  # step with the ruff version pinned in uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # Bandit -- security lint; official hook repo, rev kept in step with uv.lock.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        exclude: ^tests/
  # uv -- keeps uv.lock in step with pyproject.toml (re-locks on drift);
  # official hook repo, rev kept in step with the uv version in uv.lock.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.21
    hooks:
      - id: uv-lock
        args: [--check, --offline]
  # Codespell -- typo checker for code and prose; official hook repo.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: ^uv\.lock$
  # Local hooks on purpose: project-aware tools must see the exact dependencies
  # and configuration locked in this repository's uv environment.
  # GitHub Actions semantic linter; also uses ShellCheck when available.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy src/binnacle tests scripts
        language: system
        types: [python]
        pass_filenames: false
        # Skill scripts are standalone tools with their own runtime/imports.
        exclude: ^\.claude/skills/
      - id: deptry
        name: deptry
        entry: uv run --no-sync deptry .
        language: system
        files: (\.py$|^pyproject\.toml$)
        pass_filenames: false
      - id: validate-pyproject
        name: validate pyproject metadata and tool schemas
        entry: uv run --no-sync validate-pyproject pyproject.toml
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false
      - id: tox-config
        name: validate tox configuration
        entry: uv run --no-sync tox config
        language: system
        files: ^tox\.ini$
        pass_filenames: false
      - id: module-size
        name: module size ratchet
        entry: uv run --no-sync python scripts/check_module_size.py
        language: system
        files: (\.py$|^quality-policy\.json$)
        pass_filenames: false
      - id: ai-readability
        name: AI readability warnings
        entry: uv run --no-sync python scripts/check_ai_readability.py
        language: system
        files: (^src/binnacle/.*\.py$|^quality-policy\.json$)
        pass_filenames: false
      - id: architecture
        name: architecture boundaries
        entry: uv run --no-sync python scripts/check_architecture.py
        language: system
        files: (^src/binnacle/.*\.py$|^quality-policy\.json$)
        pass_filenames: false
      - id: import-linter
        name: import architecture contracts
        entry: uv run --no-sync lint-imports --no-logo
        language: system
        files: (^src/binnacle/.*\.py$|^pyproject\.toml$)
        pass_filenames: false
      - id: fast-tests
        name: fast unit and contract tests
        entry: uv run --no-sync python scripts/run_test_suite.py --suite fast --seed 12345
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
