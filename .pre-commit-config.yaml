# Managed with the manage-precommit skill -- https://pre-commit.com
# Install the git hook:  pre-commit install
# Run on all files:      pre-commit run --all-files
minimum_pre_commit_version: "4.0.0"
exclude: '^\.gitignore$'
repos:
  # Base hygiene -- fast, universal checks from the pre-commit maintainers.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
  # YAML linter -- config lives in the repo's .yamllint.yaml (copied by the skill).
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  # Markdown linter -- config lives in the repo's .markdownlint.yaml (copied by the skill).
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        # Reference corpora preserve source formatting; project prose is linted.
        exclude: ^\.claude/skills/.*/references/
  # Secret scanner -- blocks commits that contain credentials/tokens.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # Ruff -- lint (with autofix) and format; official hook repo, rev kept in
  # step with the ruff version pinned in uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # Bandit -- security lint; official hook repo, rev kept in step with uv.lock.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        exclude: ^tests/
  # uv -- keeps uv.lock in step with pyproject.toml (re-locks on drift);
  # official hook repo, rev kept in step with the uv version in uv.lock.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.7
    hooks:
      - id: uv-lock
  # Codespell -- typo checker for code and prose; official hook repo.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: ^uv\.lock$
  # Local hooks on purpose: an isolated hook env cannot see the project's
  # dependencies, the uv environment can. pip-audit checks the locked
  # dependency set against the OSV vulnerability database (network call), so
  # it fires only when uv.lock changes, never on ordinary commits.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy src/binnacle tests scripts
        language: system
        types: [python]
        pass_filenames: false
        # Skill scripts are standalone tools with their own runtime/imports.
        exclude: ^\.claude/skills/
      - id: pip-audit
        name: pip-audit
        entry: uv run --no-sync pip-audit --progress-spinner off
        language: system
        files: ^uv\.lock$
        pass_filenames: false
      - id: deptry
        name: deptry
        entry: uv run --no-sync deptry .
        language: system
        files: (\.py$|^pyproject\.toml$)
        pass_filenames: false
      - id: module-size
        name: module size ratchet
        entry: uv run --no-sync python scripts/check_module_size.py
        language: system
        files: (\.py$|^quality-policy\.json$)
        pass_filenames: false
      - id: architecture
        name: architecture boundaries
        entry: uv run --no-sync python scripts/check_architecture.py
        language: system
        files: (^src/binnacle/.*\.py$|^quality-policy\.json$)
        pass_filenames: false
