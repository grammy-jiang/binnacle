[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "binnacle"
version = "0.1.0.dev0"
description = "Deterministic MCP execution and observation boundary for a Raspberry Pi/Linux device"
requires-python = ">=3.11,<3.14"
dependencies = [
  "anyio>=4,<5",
  "fastmcp==4.0.0b2",
  "fastmcp-slim[client,server]==4.0.0b2",
  "jsonschema>=4.26,<5",
  "mcp>=2,<3",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "rich>=15,<16",
  "structlog>=26,<27",
  "starlette>=1,<2",
  "typer>=0.27,<1",
  "uvicorn>=0.40,<1",
]

[project.scripts]
binnacle = "binnacle.cli:main"

[dependency-groups]
test = [
  "coverage[toml]>=7,<8",
  "httpx2>=2,<3",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
]
quality = [
  "import-linter>=2,<3",
  "mypy>=1.19,<2",
  "pip-audit>=2.10,<3",
  "pre-commit>=4,<5",
  "rstcheck[toml]>=6.3,<7",
  "ruff>=0.15,<1",
]
matrix = [
  "tox>=4.47,<5",
  "tox-uv>=1.33,<2",
]
contracts = [
  "jsonschema>=4.26,<5",
  "PyYAML>=6.0.3,<7",
]
dev = [
  { include-group = "test" },
  { include-group = "quality" },
  { include-group = "matrix" },
  { include-group = "contracts" },
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"binnacle._generated" = ["*.json"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "BLE", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
files = [
  "src/binnacle",
  "tests",
  "scripts/mcp_evaluation.py",
  "scripts/setup_dev_pi.py",
  "scripts/verify_dev_pi.py",
]

[tool.pytest.ini_options]
addopts = [
  "--cov=binnacle",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
testpaths = ["tests"]
strict_config = true
strict_markers = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["binnacle"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.rstcheck]
report_level = "ERROR"
ignore_languages = ["bash", "c", "cpp", "doctest", "json", "python", "xml"]

[tool.importlinter]
root_package = "binnacle"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is framework independent"
type = "forbidden"
source_modules = ["binnacle.domain"]
forbidden_modules = [
  "binnacle.adapters",
  "binnacle.application",
  "binnacle.cli",
  "binnacle.composition",
  "binnacle.config",
  "binnacle.logging",
  "binnacle.contracts",
  "binnacle.evaluation",
  "binnacle.security",
  "fastmcp",
  "mcp",
  "pydantic",
  "pydantic_settings",
  "rich",
  "structlog",
  "typer",
  "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Ports depend on domain only"
type = "forbidden"
source_modules = ["binnacle.ports"]
forbidden_modules = [
  "binnacle.adapters",
  "binnacle.application",
  "binnacle.bootstrap",
  "binnacle.cli",
  "binnacle.composition",
  "binnacle.config",
  "binnacle.contracts",
  "binnacle.logging",
  "binnacle.evaluation",
  "binnacle.security",
  "fastmcp",
  "jsonschema",
  "mcp",
  "pydantic",
  "pydantic_settings",
  "rich",
  "starlette",
  "structlog",
  "typer",
  "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Application depends inward only"
type = "forbidden"
source_modules = ["binnacle.application"]
forbidden_modules = [
  "binnacle.adapters",
  "binnacle.bootstrap",
  "binnacle.cli",
  "binnacle.composition",
  "binnacle.config",
  "binnacle.logging",
  "binnacle.evaluation",
  "binnacle.security",
  "fastmcp",
  "mcp",
  "pydantic",
  "pydantic_settings",
  "rich",
  "structlog",
  "typer",
  "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Bootstrap bindings remain framework independent"
type = "forbidden"
source_modules = ["binnacle.bootstrap"]
forbidden_modules = [
  "binnacle.adapters",
  "binnacle.cli",
  "binnacle.composition",
  "binnacle.config",
  "binnacle.logging",
  "fastmcp",
  "mcp",
  "pydantic",
  "pydantic_settings",
  "rich",
  "starlette",
  "structlog",
  "typer",
  "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Contract registry is independent from delivery"
type = "forbidden"
source_modules = ["binnacle.contracts"]
forbidden_modules = [
  "binnacle.adapters",
  "binnacle.application",
  "binnacle.bootstrap",
  "binnacle.cli",
  "binnacle.composition",
  "binnacle.config",
  "binnacle.logging",
  "fastmcp",
  "mcp",
  "pydantic",
  "pydantic_settings",
  "rich",
  "starlette",
  "structlog",
  "typer",
  "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Adapters do not depend on delivery or composition"
type = "forbidden"
source_modules = ["binnacle.adapters"]
forbidden_modules = [
  "binnacle.cli",
  "binnacle.composition",
  "binnacle.config",
  "binnacle.evaluation",
  "binnacle.logging",
]

[[tool.importlinter.contracts]]
name = "Controller security stays outside delivery and application"
type = "forbidden"
source_modules = ["binnacle.security"]
forbidden_modules = [
  "binnacle.adapters",
  "binnacle.application",
  "binnacle.bootstrap",
  "binnacle.cli",
  "binnacle.composition",
  "binnacle.config",
  "binnacle.contracts",
  "binnacle.evaluation",
  "binnacle.logging",
  "fastmcp",
  "mcp",
  "rich",
  "structlog",
  "typer",
  "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Evaluation tooling stays outside runtime and delivery"
type = "forbidden"
source_modules = ["binnacle.evaluation"]
forbidden_modules = [
  "binnacle.adapters",
  "binnacle.application",
  "binnacle.bootstrap",
  "binnacle.cli",
  "binnacle.composition",
  "binnacle.config",
  "binnacle.contracts",
  "binnacle.domain",
  "binnacle.logging",
  "binnacle.ports",
  "binnacle.security",
  "fastmcp",
  "mcp",
  "pydantic_settings",
  "rich",
  "starlette",
  "structlog",
  "typer",
  "uvicorn",
]

[[tool.importlinter.contracts]]
name = "CLI is not an inward dependency"
type = "forbidden"
source_modules = [
  "binnacle.adapters",
  "binnacle.application",
  "binnacle.composition",
  "binnacle.config",
  "binnacle.domain",
  "binnacle.logging",
]
forbidden_modules = ["binnacle.cli"]

[tool.tox]
legacy_tox_ini = """
[tox]
env_list = py311, py312, py313, quality

[testenv]
runner = uv-venv-lock-runner
dependency_groups = test
commands = pytest

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = test, quality, contracts
commands =
    ruff check .
    ruff format --check .
    mypy src/binnacle tests scripts/mcp_evaluation.py scripts/setup_dev_pi.py scripts/verify_dev_pi.py
    lint-imports
    pip-audit
    rstcheck --recursive docs
    python scripts/compile_mcp_registry.py --check
    python scripts/validate_contracts.py
    python scripts/validate_schema_instances.py
    python scripts/mcp_evaluation.py --help
    python scripts/setup_dev_pi.py --help
    python scripts/verify_dev_pi.py --help
"""
