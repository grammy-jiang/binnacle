[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Keep Dependabot compatible with the reviewed uv minor line. The exact
# developer/pre-commit/CI uv version is the uv package pinned in uv.lock and
# is enforced by scripts/dev.py.
required-version = ">=0.12.7,<0.13"

[project]
name = "binnacle-mcp"
version = "1.0.0"
description = "MCP server that lets AI agents work on a Raspberry Pi."
requires-python = ">=3.10"
dependencies = [
    "cyclopts>=4.23.3", # the CLI framework fastmcp's own CLI uses
    "fastmcp==4.0.10", # deliberate stable FastMCP 4 baseline
    "orjson>=3.11.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "starlette>=1.6.0", # request/response types for native FastMCP custom routes
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
binnacle = "binnacle.cli:main"
binnacle-jobs = "binnacle.job_manager:main"
binnacle-watchdog = "binnacle.watchdog_cli:main"
binnacle-tunnel = "binnacle.tunnel_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
binnacle = ["py.typed"]

[dependency-groups]
test = [
    "httpx2>=2.12.0",
    "hypothesis>=6.167.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=4.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]
lint = [
    "bandit>=1.9.4",
    "deptry>=0.25.1",
    "import-linter>=2.14",
    "lizard>=1.24.0",
    "mypy>=2.3.1",
    "ruff>=0.16.5,<0.17",
    "validate-pyproject[all,store]>=0.26",
]
security = [
    "pip-audit>=2.10.1",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "mutmut>=3.7.0",
    "pre-commit>=4.0.0",
    "tox>=4.61.1",
    "tox-uv>=1.36.0",
    "uv==0.12.21", # exact developer/CI toolchain pin; Dependabot updates it
]

[tool.pytest.ini_options]
# Fail on unknown pytest configuration, markers, parametrization ids and
# non-strict xfails. pytest itself is locked, so strict-mode evolution is
# reviewed as part of dependency updates rather than changing underneath CI.
strict = true
# Constrain discovery to the managed suite; developer artifacts such as
# mutation-testing copies must never be collected by default pytest.
testpaths = ["tests"]
# A hung test (the job tools spawn real subprocesses) fails instead of
# freezing a tox run; 60 s is far above any test's honest runtime.
timeout = 60
markers = [
    "no_xdist: test must run in a normal pytest process, not an xdist worker",
]

[tool.coverage.run]
# Branch coverage, measured at 87% on 2026-09-13 (350 tests). The authoritative
# gate runs only in the dedicated tox coverage-policy environment; ordinary
# compatibility tox environments stay uncovered and fast. Ratchet fail_under
# up as the number rises, never down.
branch = true
source = ["binnacle"]

[tool.coverage.report]
# 86.9: the measured floor was 87.00% displayed / 86.99% exact, so an integer
# 87 fails on rounding. Ratchet up as coverage rises; never down.
fail_under = 86.9
precision = 2
show_missing = true
skip_covered = true

[tool.mutmut]
# Mutation testing on demand, per module (hours for a full run on the Pi;
# never a hook): `mutmut run` then `mutmut results`. src layout: mutmut copies
# source_paths into ./mutants, runs the tests from inside ./mutants and puts
# mutants/<source_path> first on sys.path -- so this must be "src", not
# "src/binnacle": with the package directory itself as the entry,
# `import binnacle` still resolves to the editable install and every mutant
# "survives" (measured 2026-09-13: 24/24 on textio before this fix).
source_paths = ["src"]
pytest_add_cli_args_test_selection = ["tests/"]
do_not_mutate = ["src/binnacle/cli.py"]
# The suite runs inside ./mutants, which holds only src, tests and the lock and
# config files unless listed here: tests/contracts/test_descriptions.py reads
# the skill references, the chatgpt-send tests the skill's scripts, the
# tests/scripts suite imports scripts/ and reads the chat-scheduling benchmark
# scenarios, and the policy gates read quality-policy.json. Measured
# 2026-09-28 by running the whole suite in a copy of that layout: without
# scripts/, 20 test modules failed to import; without benchmarks/, 30 tests
# failed; with this list, none.
also_copy = [
    ".claude/skills/chatgpt-mcp-dev/references/",
    ".claude/skills/chatgpt-mcp-dev/scripts/",
    "scripts/",
    "benchmarks/chat-mode-scheduling-v2/",
    "quality-policy.json",
]

[tool.bandit]
# B404/B603/B607: subprocess execution is this server's core mechanism --
# run_command runs arbitrary shell by design (docs/agent-toolset-design.md
# §6.7), list_files/search_text drive ripgrep, and the CLI drives systemctl.
# B108: /tmp is a configured allowed root, not an insecure temp file.
skips = ["B404", "B603", "B607", "B108"]

[tool.codespell]
# ACI = SWE-agent's "Agent-Computer Interface" (cited in docs/tools/read_file.md).
ignore-words-list = "aci"

[tool.deptry]
# The dist name is binnacle-mcp; the import package is binnacle.
known_first_party = ["binnacle", "scripts"]
# Agent tooling with its own conventions and imports, not server code.
extend_exclude = ["\\.claude", "\\.tox", "build", "dist"]

[tool.deptry.per_rule_ignores]
# tests/ legitimately imports the test dependency group.
DEP004 = ["pytest"]

[tool.mypy]
# The floor of requires-python: catches APIs newer than the oldest
# supported interpreter (e.g. PurePath.full_match, 3.13-only).
python_version = "3.10"
# Global checks that are useful for tests and scripts without making their
# intentionally partial fakes satisfy production-level typing strictness.
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Teaches mypy pydantic's synthesized __init__ and Field() semantics.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["binnacle", "binnacle.*"]
check_untyped_defs = true
strict_equality = true
warn_unreachable = true
extra_checks = true

[tool.ruff]
required-version = ">=0.16.5,<0.17"

[tool.ruff.lint]
# Incremental, stable rule families with low migration cost. Preview rules stay
# off so lint behaviour changes only when the pinned Ruff version is reviewed.
extend-select = ["B", "I", "UP", "C4", "PIE", "RET", "DTZ", "T10"]

[tool.importlinter]
root_package = "binnacle"

[[tool.importlinter.contracts]]
id = "tools-only-server"
name = "Legacy MCP modules are not imported by product domains"
type = "protected"
protected_modules = ["binnacle.tools"]
allowed_importers = [
    "binnacle.features.commands.commands_server",
]

[[tool.importlinter.contracts]]
id = "commands-tools-only-commands-server"
name = "Commands MCP tools are owned by their focused server and legacy aliases"
type = "protected"
protected_modules = ["binnacle.features.commands.tools"]
allowed_importers = [
    "binnacle.features.commands.commands_server",
    "binnacle.tools.run_command",
    "binnacle.tools.job_status",
    "binnacle.tools.stop_job",
]

[[tool.importlinter.contracts]]
id = "files-tools-only-files-server"
name = "Files MCP tools are imported only by the Files server"
type = "protected"
protected_modules = ["binnacle.features.files.tools"]
allowed_importers = ["binnacle.features.files.files_server"]

[[tool.importlinter.contracts]]
id = "files-tool-modules-independent"
name = "Files MCP tool modules are independent"
type = "independence"
modules = ["binnacle.features.files.tools.*"]

[[tool.importlinter.contracts]]
id = "search-tools-only-search-server"
name = "Search MCP tools are imported only by the Search server"
type = "protected"
protected_modules = ["binnacle.features.search.tools"]
allowed_importers = ["binnacle.features.search.search_server", "binnacle.tools.search_text"]

[[tool.importlinter.contracts]]
id = "focused-servers-independent"
name = "Focused MCP servers are independent"
type = "independence"
modules = [
    "binnacle.features.files.files_server",
    "binnacle.features.search.search_server",
    "binnacle.features.commands.commands_server",
]

[[tool.importlinter.contracts]]
id = "watchdog-isolated"
name = "Watchdog internals are isolated from Binnacle core"
type = "protected"
protected_modules = ["binnacle.ops.watchdog"]
allowed_importers = ["binnacle.watchdog", "binnacle.watchdog_cli"]

[[tool.importlinter.contracts]]
id = "server-not-dependency"
name = "Server composition root is not a dependency"
type = "forbidden"
source_modules = ["binnacle.**"]
forbidden_modules = ["binnacle.server"]
as_packages = false

[[tool.importlinter.contracts]]
id = "tool-modules-independent"
name = "MCP tool modules are independent"
type = "independence"
modules = ["binnacle.tools.*"]

[[tool.importlinter.contracts]]
id = "commands-feature-tool-modules-independent"
name = "Commands MCP adapters remain independent"
type = "independence"
modules = ["binnacle.features.commands.tools.*"]

[[tool.importlinter.contracts]]
id = "watchdog-acyclic"
name = "Watchdog internals remain acyclic"
type = "acyclic_siblings"
ancestors = ["binnacle.ops.watchdog"]

[[tool.importlinter.contracts]]
id = "top-level-acyclic"
name = "Top-level Binnacle modules remain acyclic"
type = "acyclic_siblings"
ancestors = ["binnacle"]
depth = 0

[[tool.importlinter.contracts]]
id = "commands-adapters-use-domain"
name = "Commands adapters use the command domain instead of job internals"
type = "forbidden"
source_modules = [
    "binnacle.features.commands.tools.run_command",
    "binnacle.features.commands.tools.job_status",
    "binnacle.features.commands.tools.stop_job",
]
forbidden_modules = [
    "binnacle.jobs",
    "binnacle.job_owner",
    "binnacle.job_client",
    "binnacle.job_store",
    "binnacle.job_output",
    "binnacle.platform.linux.job_process",
    "binnacle.platform.linux.job_cgroup",
    "binnacle.job_resource_history",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "command-domain-explicit-backend"
name = "Command use cases do not select or import a durable engine"
type = "forbidden"
source_modules = [
    "binnacle.features.commands.command_contracts",
    "binnacle.features.commands.command_execution",
    "binnacle.features.commands.command_status",
]
forbidden_modules = [
    "binnacle.command_backend",
    "binnacle.features.commands.command_backend",
    "binnacle.jobs",
    "binnacle.job_owner",
    "binnacle.job_client",
    "binnacle.job_manager",
    "binnacle.platform.job_platform",
    "binnacle.platform.linux.job_process",
    "binnacle.platform.linux.job_cgroup",
    "binnacle.job_resource_history",
    "binnacle.tools",
]
allow_indirect_imports = true


[[tool.importlinter.contracts]]
id = "platform-contracts-independent"
name = "Platform contracts do not select engines or concrete adapters"
type = "forbidden"
source_modules = ["binnacle.platform.contracts.process_contracts", "binnacle.platform.contracts.resource_contracts"]
forbidden_modules = [
    "binnacle.jobs", "binnacle.job_owner", "binnacle.job_manager",
    "binnacle.job_store", "binnacle.platform.job_platform", "binnacle.platform.linux.job_process",
    "binnacle.platform.linux.job_cgroup", "binnacle.job_resource_history", "binnacle.config",
]

[[tool.importlinter.contracts]]
id = "platform-adapters-independent"
name = "Linux process and accounting adapters remain independent"
type = "independence"
modules = ["binnacle.platform.linux.job_process", "binnacle.platform.linux.job_cgroup"]

[[tool.importlinter.contracts]]
id = "platform-adapters-no-policy"
name = "Linux adapters do not own job lifecycle or storage"
type = "forbidden"
source_modules = ["binnacle.platform.linux.job_process", "binnacle.platform.linux.job_cgroup"]
forbidden_modules = [
    "binnacle.jobs", "binnacle.job_owner", "binnacle.job_manager", "binnacle.job_client",
    "binnacle.job_store", "binnacle.job_resource_history", "binnacle.config",
]

[[tool.importlinter.contracts]]
id = "job-orchestration-uses-platform-ports"
name = "Job orchestration does not directly import Linux adapters"
type = "forbidden"
source_modules = ["binnacle.jobs", "binnacle.job_owner", "binnacle.job_manager", "binnacle.job_resource_history"]
forbidden_modules = ["binnacle.platform.linux.job_process", "binnacle.platform.linux.job_cgroup"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "platform-composition-entrypoints"
name = "Only job engine and manager select platform defaults"
type = "protected"
protected_modules = ["binnacle.platform.job_platform"]
allowed_importers = ["binnacle.jobs", "binnacle.job_manager"]

[[tool.importlinter.contracts]]
id = "store-does-not-own-lifecycle"
name = "Job storage does not import process or accounting lifecycle"
type = "forbidden"
source_modules = ["binnacle.job_store"]
forbidden_modules = [
    "binnacle.jobs", "binnacle.job_owner", "binnacle.job_manager", "binnacle.job_client",
    "binnacle.platform.contracts.process_contracts", "binnacle.platform.contracts.resource_contracts", "binnacle.platform.linux.job_process",
    "binnacle.platform.linux.job_cgroup", "binnacle.platform.job_platform", "binnacle.job_resource_history",
]

[[tool.importlinter.contracts]]
id = "companions-no-aggregate-shells"
name = "Companions consume neutral diagnostics instead of aggregate shells"
type = "forbidden"
source_modules = ["binnacle.watchdog_doctor", "binnacle.watchdog_cli", "binnacle.tunnel_cli", "binnacle.tunnel_doctor", "binnacle.ops.watchdog.services"]
forbidden_modules = ["binnacle.doctor", "binnacle.cli", "binnacle.doctor_connectivity"]
as_packages = false

[[tool.importlinter.contracts]]
id = "webmin-through-observability"
name = "Only the resource history composition selects Webmin"
type = "protected"
protected_modules = ["binnacle.webminstats"]
allowed_importers = ["binnacle.system_resource_history"]
