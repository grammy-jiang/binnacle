schema_version: "1.1"
contract: AUDIT-EVIDENCE
contract_version: "1.1.0"

canonicalization:
  algorithm: rfc8785-jcs
  digest: sha256
  profile_id: rfc8785-jcs+sha256-v1
  event_hash_field_excluded_from_preimage: true
  duplicate_object_names_forbidden: true
  non_i_json_numbers_forbidden: true
  negative_zero_normalized_by_jcs: true

hash_chain:
  event_previous_hash_required: true
  segment_chain_required: true
  audit_epoch_chain_required: true
  sequence_strictly_monotonic: true
  fork_is_integrity_failure: true

external_checkpoint:
  optional_for_local_integrity_claim: true
  required_for_post_compromise_history_claim: true
  required_fields:
    - stream_id
    - audit_epoch
    - first_sequence
    - last_sequence
    - checkpoint_digest
    - previous_checkpoint_digest
    - issuer_identity
    - issued_at
    - signature_or_receipt
  non_equivocation:
    same_stream_epoch_range_must_have_one_digest: true
    conflicting_valid_signatures_are_integrity_failure: true
    continuity_to_previous_accepted_checkpoint_required: true
    independently_published_append_only_receipt_preferred: true

redaction:
  before_persistence: true
  before_hashing: true
  credentials_forbidden: true
  authority_material_forbidden: true
  raw_idempotency_keys_forbidden: true
  raw_prompt_context_default_forbidden: true
  untrusted_payloads_use_bounded_digest_or_excerpt: true

size_limits:
  safe_fact_items_max: 64
  safe_fact_string_chars_max: 2048
  canonical_event_bytes_max: 65536
  correlation_ids_max: 32

retention_classes:
  AR1:
    description: ordinary observation and compatibility audit
    minimum_days: 7
  AR2:
    description: bounded local mutation and command audit
    minimum_days: 30
  AR3:
    description: destructive, self-management, external, or credential audit
    minimum_days: 90
  AR4:
    description: uncertain, compromise, recovery, or integrity audit
    minimum_days: 365
    retain_until_reconciled_if_longer: true

access_and_export:
  authenticated_and_authorized: true
  information_class_revalidated: true
  export_records_own_audit_event: true
  canonical_bytes_and_checkpoint_evidence_preserved: true
  raw_audit_directory_is_not_support_bundle: true

storage_failure:
  new_consequential_work: blocked
  bounded_status_and_recovery: allowed_with_reserved_capacity
  silent_unaudited_fallback: forbidden
  emergency_journal: bounded
  emergency_journal_exhaustion: fail_restricted

mcp_evidence_projection:
  required_fields:
    - source
    - provenance
    - information_class
    - freshness
    - result_sha256
    - operation_id
    - audit_ref
    - bounded_facts
  projection_is_not_authoritative_audit_record: true
