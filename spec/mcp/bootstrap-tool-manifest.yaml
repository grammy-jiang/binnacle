schema_version: "1.1"
manifest_id: binnacle-bootstrap-tools
manifest_version: "1.2.0"
canonicalization_profile: binnacle-manifest-json-v1
runtime_digest_record: detached-release-evidence

schema_registry:
  common:
    path: schemas/mcp/binnacle-common.schema.json
  inputs:
    path: schemas/mcp/bootstrap-inputs.schema.json
  outputs:
    path: schemas/mcp/bootstrap-outputs.schema.json
  resolution:
    build_must_resolve_json_pointer: true
    build_records_file_and_definition_sha256: true
    startup_verifies_against_detached_manifest_digest: true

catalogue_phases:
  compatibility-core:
    private_cache: true
    ttl_ms: 0
  compatibility-write-probe:
    private_cache: true
    ttl_ms: 0
  v1-readonly:
    private_cache: true
    synthetic_tools_default_visible: false
  v1-operational:
    private_cache: true
    synthetic_tools_default_visible: false

runtime_rules:
  filter_only: true
  semantic_rewrite_forbidden: true
  duplicate_or_confusable_names_forbidden: true
  unmanifested_tools_forbidden: true
  schema_or_handler_mismatch_fails_startup: true

annotations_defaults:
  readOnlyHint: false
  destructiveHint: true
  idempotentHint: false
  openWorldHint: true

tools:
  - name: binnacle_probe
    title: Probe Binnacle connectivity and identity
    contract_version: "1.1"
    description: >-
      Use to verify that ChatGPT can reach this Binnacle instance and to obtain
      bounded build, device, negotiated-protocol, reviewed-manifest, and visible-
      catalogue identities. Do not use for detailed system health or compatibility
      conclusions; use system_inspect or compatibility_report instead. Returns one
      normal-result envelope. It is read-only and may fail on authentication,
      unsupported revision, manifest mismatch, or unavailable device identity.
    input_schema_ref: schemas/mcp/bootstrap-inputs.schema.json#/$defs/binnacle_probe.input.v1_1
    output_schema_ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/binnacle_probe.output.v1_1
    handler_binding: binnacle.bootstrap.binnacle_probe.v1_1
    information_class: normal-result
    confirmation_class: HC0
    phases: [compatibility-core, compatibility-write-probe]
    test_only_phases: [v1-readonly]
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false

  - name: system_inspect
    title: Inspect bounded Raspberry Pi system facts
    contract_version: "1.1"
    description: >-
      Use for bounded read-only OS, kernel, architecture, uptime, CPU, memory,
      filesystem-summary, and Binnacle-service facts. Do not use for arbitrary file,
      process, network, package, or hardware inspection. Returns one normal-result
      envelope. It may fail when a requested section is unsupported or evidence cannot
      be collected within the read budget.
    input_schema_ref: schemas/mcp/bootstrap-inputs.schema.json#/$defs/system_inspect.input.v1_1
    output_schema_ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/system_inspect.output.v1_1
    handler_binding: binnacle.bootstrap.system_inspect.v1_1
    information_class: normal-result
    confirmation_class: HC0
    phases: [compatibility-core, compatibility-write-probe, v1-readonly]
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false

  - name: probe_result_formats
    title: Probe ChatGPT result-format handling
    contract_version: "1.1"
    description: >-
      Use only during compatibility evaluation to exercise strings, numbers, arrays,
      nested objects, nulls, and warnings. Do not use as an operational data source.
      Returns deterministic normal-result test data and changes no device state.
    input_schema_ref: schemas/mcp/bootstrap-inputs.schema.json#/$defs/probe_result_formats.input.v1_1
    output_schema_ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/probe_result_formats.output.v1_1
    handler_binding: binnacle.bootstrap.probe_result_formats.v1_1
    information_class: normal-result
    confirmation_class: HC0
    phases: [compatibility-core, compatibility-write-probe]
    test_only_phases: [v1-readonly]
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false

  - name: probe_error
    title: Probe deterministic error presentation
    contract_version: "1.1"
    description: >-
      Use only to test invalid input, policy rejection, known failure, timeout,
      uncertainty, or bounded delay. Do not use to diagnose real system failures.
      It creates no intentional device effect. Returns either the bounded-delay success
      envelope or a canonical execution-error envelope.
    input_schema_ref: schemas/mcp/bootstrap-inputs.schema.json#/$defs/probe_error.input.v1_1
    output_schema_ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/probe_error.output.v1_1
    handler_binding: binnacle.bootstrap.probe_error.v1_1
    information_class: normal-result
    confirmation_class: HC0
    phases: [compatibility-core, compatibility-write-probe]
    test_only_phases: [v1-readonly]
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false

  - name: compatibility_report
    title: Read sanitized ChatGPT compatibility evidence
    contract_version: "1.1"
    description: >-
      Use to read the sanitized empirical compatibility profile and its limitations.
      Do not infer support for an untested account, workspace, revision, or feature.
      The report excludes credentials, raw headers, private owner data, and reusable
      authority material, so its output is normal-result. It may report untested,
      blocked, unstable, or expired conclusions.
    input_schema_ref: schemas/mcp/bootstrap-inputs.schema.json#/$defs/compatibility_report.input.v1_1
    output_schema_ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/compatibility_report.output.v1_1
    handler_binding: binnacle.bootstrap.compatibility_report.v1_1
    information_class: normal-result
    confirmation_class: HC0
    phases: [compatibility-core, compatibility-write-probe, v1-readonly]
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false

  - name: probe_workspace_prepare
    title: Prepare one disposable workspace write or cleanup
    contract_version: "1.1"
    description: >-
      Use before probe_workspace_write or probe_workspace_cleanup to create a short-
      lived, no-effect binding for one exact relative path, content digest, and maximum
      effect. Do not treat the returned identifiers as owner approval. Returns a
      prepared_operation_id, execution_nonce, expiry, and normalized input digest.
    input_schema_ref: schemas/mcp/bootstrap-inputs.schema.json#/$defs/probe_workspace_prepare.input.v1_1
    output_schema_ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/probe_workspace_prepare.output.v1_1
    handler_binding: binnacle.bootstrap.probe_workspace_prepare.v1_1
    information_class: normal-result
    confirmation_class: HC0
    phases: [compatibility-write-probe]
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false

  - name: probe_workspace_write
    title: Create one file in the disposable probe workspace
    contract_version: "1.1"
    description: >-
      Use only after probe_workspace_prepare to create one new file under the isolated
      probe root. Do not use for repository or system files and do not retry with a new
      idempotency key after an uncertain result. It cannot overwrite, use backslashes,
      traverse directories, access credentials, or contact a network. Returns one
      artifact identity and digest or a canonical execution error.
    input_schema_ref: schemas/mcp/bootstrap-inputs.schema.json#/$defs/probe_workspace_write.input.v1_1
    output_schema_ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/probe_workspace_write.output.v1_1
    handler_binding: binnacle.bootstrap.probe_workspace_write.v1_1
    information_class: normal-result
    confirmation_class: HC1
    phases: [compatibility-write-probe]
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false

  - name: probe_workspace_cleanup
    title: Remove one exact disposable probe artifact
    contract_version: "1.1"
    description: >-
      Use only after probe_workspace_prepare to remove one exact manifest-owned probe
      artifact identified by path, artifact identity, and content digest. Do not use as
      bulk cleanup or for unrelated files. Returns removed or already-missing status;
      mismatched identity, digest, preparation, or ownership is rejected.
    input_schema_ref: schemas/mcp/bootstrap-inputs.schema.json#/$defs/probe_workspace_cleanup.input.v1_1
    output_schema_ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/probe_workspace_cleanup.output.v1_1
    handler_binding: binnacle.bootstrap.probe_workspace_cleanup.v1_1
    information_class: normal-result
    confirmation_class: HC1
    phases: [compatibility-write-probe]
    annotations:
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: false

  - name: privileged_prepare
    title: Prepare one exact privileged operation
    contract_version: "1.0"
    description: >-
      Use before package_install, binnacle_service_restart, or binnacle_restart to
      prepare one no-effect, short-lived operation bound to the exact device, protected
      profile, current state, maximum effect, and recovery disclosure. Do not treat the
      preparation or execution nonce as owner approval. It performs no package-manager,
      systemd, runtime-selector, or reboot effect and returns the complete HC2 review
      view required by the selected execute Tool.
    input_schema_ref: schemas/mcp/bootstrap-inputs.schema.json#/$defs/privileged_prepare.input.v1_0
    output_schema_ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/privileged_prepare.output.v1_0
    handler_binding: binnacle.privileged_tools.privileged_prepare_v1_0
    information_class: normal-result
    confirmation_class: HC0
    phases: [v1-operational]
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false

  - name: package_inspect
    title: Inspect one allowed development package
    contract_version: "1.0"
    description: >-
      Use for bounded installed, candidate, trusted-repository freshness, package-lock,
      and preparation-availability facts for one package allowed by the protected
      package profile. It never refreshes package metadata or invokes a package effect.
      Do not use for arbitrary package-manager queries, repository changes, removals,
      downgrades, or unrestricted package listings.
    input_schema_ref: schemas/mcp/bootstrap-inputs.schema.json#/$defs/package_inspect.input.v1_0
    output_schema_ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/package_inspect.output.v1_0
    handler_binding: binnacle.privileged_tools.package_inspect_v1_0
    information_class: normal-result
    confirmation_class: HC0
    phases: [v1-operational]
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false

  - name: package_install
    title: Install one exact prepared package closure
    contract_version: "1.0"
    description: >-
      Use only after privileged_prepare and owner confirmation to execute the exact
      immutable package transaction plan against unchanged trusted repository metadata,
      artifacts, solver closure, installed pre-state, and protected package profile.
      It cannot accept caller-supplied options, shell text, removals, downgrades, or an
      unprepared dependency change. Reconnect and same-key retry return retained truth;
      uncertain or partial effects are never blindly repeated.
    input_schema_ref: schemas/mcp/bootstrap-inputs.schema.json#/$defs/package_install.input.v1_0
    output_schema_ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/package_install.output.v1_0
    handler_binding: binnacle.privileged_tools.package_install_v1_0
    information_class: restricted-result
    confirmation_class: HC2
    phases: [v1-operational]
    annotations:
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: false

  - name: binnacle_service_inspect
    title: Inspect the fixed Binnacle development service
    contract_version: "1.0"
    description: >-
      Use for bounded normalized systemd state, correlated application readiness,
      runtime identity digest, and last controlled-restart checkpoint state for the
      single protected Binnacle development service profile. It cannot inspect arbitrary
      units or journals, and systemd active is never reported as application readiness.
    input_schema_ref: schemas/mcp/bootstrap-inputs.schema.json#/$defs/binnacle_service_inspect.input.v1_0
    output_schema_ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/binnacle_service_inspect.output.v1_0
    handler_binding: binnacle.privileged_tools.binnacle_service_inspect_v1_0
    information_class: normal-result
    confirmation_class: HC0
    phases: [v1-operational]
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false

  - name: binnacle_service_restart
    title: Restart the unchanged Binnacle service
    contract_version: "1.0"
    description: >-
      Use only after restart_preflight, privileged_prepare, and owner confirmation to
      stop and start the fixed Binnacle development service while source, environment,
      configuration, policy, manifest, service definition, and runtime selection remain
      unchanged. It owns the exclusive workspace fence until retained broker evidence,
      runtime verification, audit, and terminal closure agree. Use binnacle_restart for
      any candidate or runtime-selector change.
    input_schema_ref: schemas/mcp/bootstrap-inputs.schema.json#/$defs/binnacle_service_restart.input.v1_0
    output_schema_ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/binnacle_service_restart.output.v1_0
    handler_binding: binnacle.privileged_tools.binnacle_service_restart_v1_0
    information_class: restricted-result
    confirmation_class: HC2
    phases: [v1-operational]
    annotations:
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: false

  - name: restart_preflight
    title: Inspect Binnacle restart readiness
    contract_version: "1.0"
    description: >-
      Use for an advisory point-in-time view of blocking operations, independently
      supervised work, workspace fences, Git, credential, package, privileged, audit,
      schema-head, peer-set, runtime, tested-candidate, and complete LKG evidence for a
      simple or controlled restart. It grants no authority and cannot close admission
      races; every execute Tool must reacquire the fence and revalidate the exact state.
    input_schema_ref: schemas/mcp/bootstrap-inputs.schema.json#/$defs/restart_preflight.input.v1_0
    output_schema_ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/restart_preflight.output.v1_0
    handler_binding: binnacle.privileged_tools.restart_preflight_v1_0
    information_class: normal-result
    confirmation_class: HC0
    phases: [v1-operational]
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false

  - name: binnacle_restart
    title: Activate one tested Binnacle runtime with LKG recovery
    contract_version: "1.0"
    description: >-
      Use only after restart_preflight, privileged_prepare, and owner confirmation to
      activate one exact isolated, terminally verified candidate runtime slot. The root
      broker checkpoints the complete candidate and LKG generations before stop,
      verifies exact post-start identity, and owns rollback without depending on the
      candidate application. Candidate failure with proven LKG recovery is reported as
      rollback_ready, never success; ambiguous recovery becomes restricted.
    input_schema_ref: schemas/mcp/bootstrap-inputs.schema.json#/$defs/binnacle_restart.input.v1_0
    output_schema_ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/binnacle_restart.output.v1_0
    handler_binding: binnacle.privileged_tools.binnacle_restart_v1_0
    information_class: restricted-result
    confirmation_class: HC2
    phases: [v1-operational]
    annotations:
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: true
      openWorldHint: false

  - name: binnacle_runtime_inspect
    title: Inspect sanitized Binnacle runtime identity
    contract_version: "1.0"
    description: >-
      Use for bounded sanitized source, dirty-state, environment, runtime-slot, lock,
      build, configuration, policy, manifest, service-profile, schema-head, layout,
      peer-set, device, process, and readiness identities. It returns digests and safe
      identifiers only, never raw environment values, credentials, protected paths,
      configuration values, or peer secrets.
    input_schema_ref: schemas/mcp/bootstrap-inputs.schema.json#/$defs/binnacle_runtime_inspect.input.v1_0
    output_schema_ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/binnacle_runtime_inspect.output.v1_0
    handler_binding: binnacle.privileged_tools.binnacle_runtime_inspect_v1_0
    information_class: normal-result
    confirmation_class: HC0
    phases: [v1-operational]
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
