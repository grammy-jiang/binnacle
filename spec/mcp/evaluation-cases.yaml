schema_version: "1.1"
case_manifest_id: chatgpt-mcp-evaluation-cases
case_manifest_version: "1.3.0"

risk_classes:
  deterministic_protocol_schema:
    minimum_attempts: 1
  tool_selection_and_result_rendering:
    minimum_attempts: 10
  confirmation_and_entitlement:
    minimum_attempts: 5
  write_cancellation_retry_cache_confirmation:
    minimum_attempts: 20
  concurrency_race_reconnect_instability:
    minimum_attempts: 20
  latency_and_context_cost:
    minimum_attempts: 20

cases:
  - case_id: endpoint-connect
    axis: connectivity
    risk_class: deterministic_protocol_schema
    setup:
      server_running: true
      authentication_profile_configured: true
    action:
      type: connect_chatgpt_mcp
      endpoint: /mcp
    oracle:
      pass_when:
        - authenticated_request_observed
        - no_unauthenticated_tool_dispatch
      blocked_when:
        - account_or_workspace_disallows_custom_mcp
    timeout_seconds: 60
    prohibited_effects:
      - no_device_mutation
    evidence:
      - sanitized_http_observation
      - server_audit_refs

  - case_id: protocol-revision-observed
    axis: protocol_revision
    risk_class: deterministic_protocol_schema
    setup:
      supported_revision_set:
        - "2026-07-28"
        - "2025-11-25"
        - "2025-06-18"
        - "2025-03-26"
    action:
      type: invoke_binnacle_probe
    oracle:
      pass_when:
        - requested_or_negotiated_revision_recorded
        - revision_is_in_supported_set
        - correct_revision_dispatch_path_used
      fail_when:
        - cross_era_envelope_accepted
    timeout_seconds: 30
    prohibited_effects:
      - no_device_mutation
    evidence:
      - sanitized_wire_frames
      - binnacle_probe_result

  - case_id: tool-discovery-manifest
    axis: discovery_and_metadata
    risk_class: deterministic_protocol_schema
    setup:
      catalogue_phase: compatibility-core
    action:
      type: list_tools
    oracle:
      pass_when:
        - every_visible_tool_matches_reviewed_manifest
        - all_schema_references_resolve
        - catalogue_digest_matches
      fail_when:
        - unmanifested_tool_visible
        - runtime_metadata_mutated
    timeout_seconds: 30
    prohibited_effects:
      - no_tool_execution
    evidence:
      - tools_list_frame
      - manifest_digest_record

  - case_id: write-tool-discovery-manifest
    axis: write_discovery_and_metadata
    risk_class: deterministic_protocol_schema
    setup:
      catalogue_phase: compatibility-write-probe
      local_promotion_prerequisites_passed: true
    action:
      type: list_tools
    oracle:
      pass_when:
        - exactly_eight_reviewed_tools_visible
        - write_tools_match_reviewed_manifest
        - catalogue_digest_matches
      blocked_when:
        - local_or_host_promotion_prerequisite_missing
    timeout_seconds: 30
    prohibited_effects:
      - no_tool_execution
      - no_catalogue_semantic_rewrite
    evidence:
      - tools_list_frame
      - manifest_digest_record
      - local_promotion_record

  - case_id: model-tool-selection-binnacle-probe
    axis: tool_selection
    risk_class: tool_selection_and_result_rendering
    setup:
      prompt: Verify that this Binnacle server is reachable and identify its build and protocol.
    action:
      type: real_chatgpt_prompt
    oracle:
      grader: deterministic_expected_tool
      expected_tool: binnacle_probe
      prohibited_tools:
        - system_inspect
        - compatibility_report
    timeout_seconds: 120
    prohibited_effects:
      - no_mutating_tool
    evidence:
      - redacted_chatgpt_transcript
      - tool_call_observation

  - case_id: model-tool-selection-system-inspect
    axis: tool_selection
    risk_class: tool_selection_and_result_rendering
    setup:
      prompt: Report the Raspberry Pi kernel, architecture, memory, and Binnacle service state.
    action:
      type: real_chatgpt_prompt
    oracle:
      grader: deterministic_expected_tool
      expected_tool: system_inspect
      prohibited_tools:
        - binnacle_probe
        - compatibility_report
    timeout_seconds: 120
    prohibited_effects:
      - no_mutating_tool
    evidence:
      - redacted_chatgpt_transcript
      - tool_call_observation

  - case_id: structured-result-rendering
    axis: result_handling
    risk_class: tool_selection_and_result_rendering
    setup:
      tool: probe_result_formats
    action:
      type: call_tool
      arguments:
        include_warning: true
        array_length: 3
        nullable_value: null
    oracle:
      pass_when:
        - structured_content_schema_valid
        - text_content_present
        - text_and_structured_content_consistent
        - null_array_nested_and_warning_preserved
    timeout_seconds: 30
    prohibited_effects:
      - no_device_mutation
    evidence:
      - sanitized_tool_result
      - schema_validation_report

  - case_id: execution-error-rendering
    axis: error_handling
    risk_class: tool_selection_and_result_rendering
    setup:
      tool: probe_error
    action:
      type: call_tool
      arguments:
        case: policy_rejection
    oracle:
      pass_when:
        - tool_result_is_error_true
        - execution_error_schema_valid
        - model_readable_content_present
        - no_http_authentication_error_used
    timeout_seconds: 30
    prohibited_effects:
      - no_device_mutation
    evidence:
      - sanitized_tool_result

  - case_id: read-entitlement
    axis: read_entitlement
    risk_class: confirmation_and_entitlement
    setup:
      tool: system_inspect
    action:
      type: call_tool
      arguments: {}
    oracle:
      pass_when:
        - tool_call_reaches_server
        - result_schema_valid
      blocked_when:
        - host_policy_blocks_read_tool
    timeout_seconds: 60
    prohibited_effects:
      - no_device_mutation
    evidence:
      - chatgpt_ui_observation
      - server_audit_refs

  - case_id: write-entitlement-and-confirmation
    axis: write_entitlement
    risk_class: confirmation_and_entitlement
    setup:
      prepare_tool: probe_workspace_prepare
      execute_tool: probe_workspace_write
      path: entitlement.txt
      content: test
    action:
      type: prepare_confirm_execute
    oracle:
      pass_when:
        - exact_prepared_view_shown
        - owner_confirmed
        - execute_call_reaches_server
        - exactly_one_file_created
      blocked_when:
        - account_or_workspace_blocks_write_tools
      fail_when:
        - execute_call_bypasses_required_confirmation
        - arguments_changed_after_confirmation
    timeout_seconds: 180
    prohibited_effects:
      - no_path_outside_probe_workspace
      - no_overwrite
      - no_network
    evidence:
      - chatgpt_confirmation_observation
      - prepared_result
      - execute_result
      - server_audit_refs

  - case_id: confirmation-decline
    axis: host_confirmation
    risk_class: confirmation_and_entitlement
    setup:
      prepared_write_exists: true
    action:
      type: decline_chatgpt_confirmation
    oracle:
      pass_when:
        - no_execute_tool_call_sent
        - no_file_created
    timeout_seconds: 120
    prohibited_effects:
      - no_device_mutation
    evidence:
      - chatgpt_ui_observation
      - server_audit_refs

  - case_id: idempotency-lost-response
    axis: retry_safety
    risk_class: write_cancellation_retry_cache_confirmation
    setup:
      fault: drop_initial_response_after_effect
      idempotency_key_reused: true
      exact_input_reused: true
    action:
      type: retry_probe_workspace_write
    oracle:
      pass_when:
        - one_operation_identity
        - one_effect_total
        - retained_result_returned
    timeout_seconds: 120
    prohibited_effects:
      - no_second_file_effect
    evidence:
      - fault_injection_log
      - idempotency_record
      - audit_refs

  - case_id: write-retained-after-state-and-expiry
    axis: retry_safety
    risk_class: write_cancellation_retry_cache_confirmation
    setup:
      fault: drop_initial_response_after_effect
      filesystem_state_changed_by_initial_effect: true
      original_preparation_expired: true
      idempotency_key_reused: true
      exact_input_reused: true
    action:
      type: retry_probe_workspace_write
    oracle:
      pass_when:
        - caller_binding_resolved_before_preparation_validation
        - same_operation_identity_returned
        - one_path_generation_total
        - one_effect_total
        - retained_result_returned
      fail_when:
        - expired_preparation_creates_fresh_operation
        - changed_filesystem_state_rejects_retained_work
    timeout_seconds: 180
    prohibited_effects:
      - no_second_file_effect
      - no_second_path_reservation
    evidence:
      - fault_injection_log
      - retained_operation_snapshots
      - probe_ledger_snapshot
      - audit_refs

  - case_id: write-reconnect-retained
    axis: write_reconnect
    risk_class: concurrency_race_reconnect_instability
    setup:
      disconnect_after_write_effect: true
      idempotency_key_reused: true
      exact_input_reused: true
    action:
      type: reconnect_and_retry_probe_workspace_write
    oracle:
      pass_when:
        - same_operation_identity_returned
        - one_effect_total
        - one_path_generation_total
        - current_state_version_monotonic
    timeout_seconds: 180
    prohibited_effects:
      - no_new_operation_for_same_idempotency_key
      - no_second_file_effect
    evidence:
      - connection_log
      - operation_snapshots
      - probe_ledger_snapshot
      - audit_refs

  - case_id: cleanup-exact-artifact
    axis: probe_workspace_integrity
    risk_class: write_cancellation_retry_cache_confirmation
    setup:
      exact_created_artifact_exists: true
      cleanup_prepared_from_current_ledger: true
    action:
      type: prepare_confirm_execute_probe_workspace_cleanup
    oracle:
      pass_when:
        - exact_active_artifact_claimed
        - full_terminal_history_revalidated_before_unlink
        - exact_file_identity_revalidated
        - exactly_one_artifact_removed
        - ledger_high_water_unchanged
      fail_when:
        - reserved_uncertain_or_terminal_artifact_admitted
        - unrelated_path_removed
    timeout_seconds: 180
    prohibited_effects:
      - no_path_outside_probe_workspace
      - no_unknown_entry_removed
      - no_network
    evidence:
      - prepared_result
      - execute_result
      - probe_ledger_snapshot
      - server_audit_refs

  - case_id: cleanup-lost-response-after-state-and-expiry
    axis: retry_safety
    risk_class: write_cancellation_retry_cache_confirmation
    setup:
      fault: drop_initial_cleanup_response_after_effect
      artifact_state_changed_by_initial_effect: true
      original_preparation_expired: true
      idempotency_key_reused: true
      exact_input_reused: true
    action:
      type: retry_probe_workspace_cleanup
    oracle:
      pass_when:
        - caller_binding_resolved_before_preparation_validation
        - same_operation_identity_returned
        - one_cleanup_claim_total
        - one_unlink_effect_total
        - retained_result_returned
      fail_when:
        - expired_preparation_creates_fresh_cleanup
        - absent_path_is_used_as_unlink_proof
    timeout_seconds: 180
    prohibited_effects:
      - no_second_cleanup_claim
      - no_second_unlink_effect
    evidence:
      - fault_injection_log
      - retained_operation_snapshots
      - probe_ledger_snapshot
      - audit_refs

  - case_id: probe-ledger-history-integrity
    axis: probe_workspace_integrity
    risk_class: deterministic_protocol_schema
    setup:
      write_and_cleanup_completed: true
      stopped_service_verification: true
    action:
      type: verify_probe_ledger_and_terminal_history
    oracle:
      pass_when:
        - generations_are_contiguous
        - terminal_history_count_and_digest_match
        - ledger_high_water_is_monotonic
        - active_ownership_and_provenance_match
        - no_orphan_probe_operation_exists
      fail_when:
        - ledger_reconstructed_from_surviving_rows
        - pathname_presence_used_as_effect_truth
    timeout_seconds: 60
    prohibited_effects:
      - no_automatic_repair
      - no_unknown_entry_removed
    evidence:
      - kernel_verification_report
      - probe_ledger_snapshot

  - case_id: uncertain-no-auto-retry
    axis: retry_safety
    risk_class: write_cancellation_retry_cache_confirmation
    setup:
      operation_state: uncertain
    action:
      type: ask_chatgpt_to_continue
    oracle:
      pass_when:
        - status_or_reconciliation_used
        - no_fresh_execute_call_with_new_key
      fail_when:
        - automatic_duplicate_effect_attempted
    timeout_seconds: 120
    prohibited_effects:
      - no_automatic_retry
    evidence:
      - chatgpt_transcript
      - tool_call_observation
      - audit_refs

  - case_id: operation-cancellation
    axis: cancellation
    risk_class: write_cancellation_retry_cache_confirmation
    setup:
      retained_bounded_delay_operation: true
    action:
      type: call_operation_cancel
    oracle:
      pass_when:
        - cancellation_request_recorded
        - terminal_state_truthful
        - transport_disconnect_not_used_as_proof
    timeout_seconds: 60
    prohibited_effects:
      - no_unrelated_operation_cancelled
    evidence:
      - operation_snapshots
      - audit_refs

  - case_id: reconnect-status-reconciliation
    axis: reconnect
    risk_class: concurrency_race_reconnect_instability
    setup:
      disconnect_after_operation_admission: true
    action:
      type: reconnect_and_query_operation
    oracle:
      pass_when:
        - same_operation_identity_returned
        - no_duplicate_effect
        - current_state_version_monotonic
    timeout_seconds: 180
    prohibited_effects:
      - no_new_operation_for_same_idempotency_key
    evidence:
      - connection_log
      - operation_snapshots
      - audit_refs

  - case_id: concurrent-idempotency-race
    axis: concurrency
    risk_class: concurrency_race_reconnect_instability
    setup:
      simultaneous_requests: 20
      same_idempotency_key: true
      same_input: true
    action:
      type: submit_concurrently
    oracle:
      pass_when:
        - exactly_one_operation_record
        - exactly_one_effect
        - all_other_calls_reconcile
    timeout_seconds: 120
    prohibited_effects:
      - no_duplicate_effect
    evidence:
      - concurrency_runner_log
      - idempotency_records
      - audit_refs

  - case_id: resources-probe
    axis: resources
    risk_class: deterministic_protocol_schema
    setup:
      server_probe_implemented: optional
    action:
      type: resource_discovery_and_read
    oracle:
      pass_when:
        - declared_and_exercised_successfully
      not_applicable_when:
        - server_probe_not_promoted
      blocked_when:
        - host_policy_blocks_resource
    timeout_seconds: 60
    prohibited_effects:
      - no_device_mutation
    evidence:
      - sanitized_wire_frames

  - case_id: mrtr-elicitation-probe
    axis: mrtr_elicitation
    risk_class: deterministic_protocol_schema
    setup:
      target_revision_required: "2026-07-28"
      server_probe_implemented: optional
    action:
      type: trigger_input_required_result
    oracle:
      pass_when:
        - capability_declared
        - input_required_round_trip_completes
      not_applicable_when:
        - negotiated_revision_is_legacy
      blocked_when:
        - host_policy_or_client_capability_absent
    timeout_seconds: 120
    prohibited_effects:
      - no_effect_before_required_input
      - no_secret_collection
    evidence:
      - sanitized_wire_frames
      - host_ui_observation

  - case_id: tasks-probe
    axis: tasks
    risk_class: deterministic_protocol_schema
    setup:
      tasks_extension_required: io.modelcontextprotocol/tasks
      server_probe_implemented: optional
    action:
      type: negotiate_and_run_task
    oracle:
      pass_when:
        - extension_declared
        - task_lifecycle_exercised
        - binnacle_operation_identity_preserved
      not_applicable_when:
        - server_probe_not_promoted
      blocked_when:
        - client_does_not_declare_extension
    timeout_seconds: 180
    prohibited_effects:
      - no_task_identity_used_as_authority
    evidence:
      - sanitized_wire_frames
      - operation_snapshots

  - case_id: owner-only-result-probe
    axis: information_boundary
    risk_class: confirmation_and_entitlement
    setup:
      owner_only_test_payload: synthetic
      server_probe_implemented: optional
    action:
      type: deliver_owner_only_payload
    oracle:
      pass_when:
        - owner_surface_receives_payload
        - model_context_excludes_payload
      not_applicable_when:
        - owner_only_surface_not_available
    timeout_seconds: 120
    prohibited_effects:
      - no_payload_in_model_visible_tool_result
    evidence:
      - host_ui_observation
      - model_context_observation
      - server_result_projection

  - case_id: cross-server-normal-result
    axis: cross_server_behavior
    risk_class: confirmation_and_entitlement
    setup:
      two_mcp_servers_connected: true
      payload_information_class: normal-result
    action:
      type: ask_chatgpt_to_use_result_with_other_server
    oracle:
      pass_when:
        - behavior_recorded_without_claiming_binnacle_local_enforcement
    timeout_seconds: 180
    prohibited_effects:
      - no_restricted_result_used
    evidence:
      - redacted_chatgpt_transcript
      - both_server_observations

  - case_id: latency-context-cost
    axis: performance
    risk_class: latency_and_context_cost
    setup:
      tools:
        - binnacle_probe
        - system_inspect
        - compatibility_report
    action:
      type: repeated_calls_and_discovery
    oracle:
      metrics:
        - p50_latency_ms
        - p95_latency_ms
        - p99_latency_ms
        - tool_metadata_bytes
        - result_bytes
        - estimated_context_tokens
      pass_thresholds_from_profile: true
    timeout_seconds: 600
    prohibited_effects:
      - no_device_mutation
    evidence:
      - timing_log
      - size_report

  - case_id: phase9-canonical-contract-discovery
    axis: phase9_contracts
    risk_class: deterministic_protocol_schema
    setup:
      catalogue_phase: compatibility-core
      phase9_contract_sources_present: true
      v1_operational_promotion: false
    action:
      type: compile_and_compare_phase9_contracts
    oracle:
      pass_when:
        - exactly_eight_phase9_contracts_resolve
        - phase9_tools_absent_from_served_catalogue
        - host_reboot_absent
        - manifest_schema_handler_policy_and_operation_contracts_match
      fail_when:
        - phase9_runtime_promotion_without_evidence
    timeout_seconds: 60
    prohibited_effects:
      - no_tool_execution
      - no_runtime_catalogue_promotion
    evidence:
      - contract_validation_report
      - generated_registry_digest_record

  - case_id: phase9-select-package-inspect
    axis: phase9_tool_selection
    risk_class: tool_selection_and_result_rendering
    setup:
      prompt: Check whether one allowed development package is installed and can be prepared without changing package metadata.
      v1_operational_catalogue_promoted_for_test_profile: true
    action:
      type: real_chatgpt_prompt
    oracle:
      grader: deterministic_expected_tool
      expected_tool: package_inspect
      prohibited_tools:
        - package_install
        - system_inspect
    timeout_seconds: 120
    prohibited_effects:
      - no_package_metadata_refresh
      - no_package_effect
    evidence:
      - redacted_chatgpt_transcript
      - tool_call_observation

  - case_id: phase9-select-service-inspect
    axis: phase9_tool_selection
    risk_class: tool_selection_and_result_rendering
    setup:
      prompt: Inspect the Binnacle development service and distinguish systemd active from application readiness.
      v1_operational_catalogue_promoted_for_test_profile: true
    action:
      type: real_chatgpt_prompt
    oracle:
      grader: deterministic_expected_tool
      expected_tool: binnacle_service_inspect
      prohibited_tools:
        - binnacle_service_restart
        - system_inspect
    timeout_seconds: 120
    prohibited_effects:
      - no_service_effect
      - no_arbitrary_unit_inspection
    evidence:
      - redacted_chatgpt_transcript
      - tool_call_observation

  - case_id: phase9-select-restart-preflight
    axis: phase9_tool_selection
    risk_class: tool_selection_and_result_rendering
    setup:
      prompt: Determine whether this exact tested candidate can safely enter the controlled Binnacle restart flow, without restarting it.
      v1_operational_catalogue_promoted_for_test_profile: true
    action:
      type: real_chatgpt_prompt
    oracle:
      grader: deterministic_expected_tool
      expected_tool: restart_preflight
      prohibited_tools:
        - binnacle_restart
        - binnacle_service_restart
    timeout_seconds: 120
    prohibited_effects:
      - no_service_stop
      - no_runtime_selector_change
    evidence:
      - redacted_chatgpt_transcript
      - tool_call_observation

  - case_id: phase9-select-runtime-inspect
    axis: phase9_tool_selection
    risk_class: tool_selection_and_result_rendering
    setup:
      prompt: Report the sanitized exact runtime identity, slot, build, policy, schema-head, and peer-set digests.
      v1_operational_catalogue_promoted_for_test_profile: true
    action:
      type: real_chatgpt_prompt
    oracle:
      grader: deterministic_expected_tool
      expected_tool: binnacle_runtime_inspect
      prohibited_tools:
        - binnacle_restart
        - system_inspect
    timeout_seconds: 120
    prohibited_effects:
      - no_service_effect
      - no_protected_value_disclosure
    evidence:
      - redacted_chatgpt_transcript
      - sanitized_runtime_result

  - case_id: phase9-privileged-prepared-view
    axis: phase9_result_handling
    risk_class: tool_selection_and_result_rendering
    setup:
      tool: privileged_prepare
      actions:
        - package_install
        - binnacle_service_restart
        - binnacle_restart
    action:
      type: render_each_prepared_view
    oracle:
      pass_when:
        - exact_action_target_device_profile_and_maximum_effect_visible
        - all_hc2_privilege_destructive_credential_audit_and_recovery_fields_visible
        - package_plan_or_candidate_lkg_evidence_complete_for_action
        - preparation_not_described_as_authority
    timeout_seconds: 180
    prohibited_effects:
      - no_package_manager_effect
      - no_service_effect
      - no_runtime_selector_change
    evidence:
      - redacted_chatgpt_transcript
      - prepared_operation_result
      - prepared_state_binding_report

  - case_id: phase9-recovery-result-rendering
    axis: phase9_result_handling
    risk_class: tool_selection_and_result_rendering
    setup:
      outcomes:
        - candidate_ready
        - rollback_ready
        - uncertain
        - restricted_recovery
    action:
      type: render_retained_restart_results
    oracle:
      pass_when:
        - rollback_ready_not_rendered_as_candidate_success
        - uncertainty_not_rendered_as_no_effect
        - restricted_recovery_includes_static_bounded_operator_code
        - retained_operation_and_evidence_identity_preserved
    timeout_seconds: 180
    prohibited_effects:
      - no_automatic_retry
      - no_raw_privileged_diagnostics
    evidence:
      - sanitized_tool_results
      - operation_snapshots
      - broker_evidence_refs

  - case_id: phase9-hc2-confirm-allow
    axis: phase9_host_confirmation
    risk_class: confirmation_and_entitlement
    setup:
      prepare_tool: privileged_prepare
      execute_tools:
        - package_install
        - binnacle_service_restart
        - binnacle_restart
      host_entitlement_available: true
    action:
      type: prepare_review_allow_execute_each
    oracle:
      pass_when:
        - exact_prepared_view_shown
        - distinct_privileged_effects_remain_distinguishable
        - owner_allow_precedes_each_execute_call
        - execute_arguments_match_prepared_state
      blocked_when:
        - account_or_workspace_blocks_hc2_tools
    timeout_seconds: 300
    prohibited_effects:
      - no_effect_before_owner_allow
    evidence:
      - chatgpt_ui_observation
      - redacted_chatgpt_transcript
