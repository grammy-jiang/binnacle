schema_version: "1.1"
profile_id: chatgpt-web-personal-binnacle-bootstrap
profile_version: "1.3.0"
manifest_schema: schemas/mcp/evaluation-manifest.schema.json
case_manifest:
  path: spec/mcp/evaluation-cases.yaml
  version: "1.3.0"
  sha256: b0fe3fc8204eb18f611c662c9772bc9554fee39e322c3f29f7b043730e5ee7af

profile_dimensions:
  chatgpt_product: /profile/chatgpt_product
  chatgpt_surface: /profile/chatgpt_surface
  account_plan: /profile/account_plan
  workspace_type: /profile/workspace_type
  workspace_policy_sha256: /profile/workspace_policy_sha256
  connection_method: /profile/connection_method
  authentication_profile: /profile/authentication_profile
  binnacle_build_sha256: /profile/binnacle_build_sha256
  binnacle_config_sha256: /profile/binnacle_config_sha256
  mcp_sdk_name: /profile/mcp_sdk_name
  mcp_sdk_version: /profile/mcp_sdk_version
  mcp_sdk_artifact_sha256: /profile/mcp_sdk_artifact_sha256
  tunnel_or_gateway_identity: /profile/tunnel_or_gateway_identity
  tunnel_or_gateway_artifact_sha256: /profile/tunnel_or_gateway_artifact_sha256
  tool_manifest_sha256: /profile/tool_manifest_sha256
  schema_registry_sha256: /profile/schema_registry_sha256
  policy_bundle_sha256: /profile/policy_bundle_sha256
  evaluation_profile_sha256: /profile/evaluation_profile_sha256
  evaluation_cases_sha256: /profile/evaluation_cases_sha256
  device_model: /profile/device_model
  device_os: /profile/device_os
  device_kernel: /profile/device_kernel
  device_architecture: /profile/device_architecture
  device_profile: /profile/device_profile
  intended_revision_set: /profile/intended_revision_set
  requested_revision: /profile/requested_revision
  negotiated_revision: /profile/negotiated_revision
  observed_client_capabilities_sha256: /profile/observed_client_capabilities_sha256

canonical_statuses:
  - observed-supported
  - observed-limited
  - declared-unexercised
  - not-declared
  - test-failed
  - host-policy-blocked
  - server-not-implemented
  - not-tested
  - unsupported-by-design
  - unstable
  - expired
  - not-applicable

risk_classes:
  deterministic_protocol_schema:
    minimum_attempts: 1
    target_pass_rate: 1.0
  tool_selection_and_result_rendering:
    minimum_attempts: 10
    target_pass_rate: 0.9
  confirmation_and_entitlement:
    minimum_attempts: 5
    target_pass_rate: 1.0
  write_cancellation_retry_cache_confirmation:
    minimum_attempts: 20
    target_pass_rate: 1.0
  concurrency_race_reconnect_instability:
    minimum_attempts: 20
    target_pass_rate: 1.0
  latency_and_context_cost:
    minimum_attempts: 20
    target_pass_rate: 0.95

metrics:
  tool_selection_correct_rate:
    minimum: 0.9
  request_schema_valid_rate:
    minimum: 1.0
  result_schema_valid_rate:
    minimum: 1.0
  confirmation_bypass_rate:
    maximum: 0.0
  exactly_one_effect_rate:
    minimum: 1.0
  cancellation_truthful_rate:
    minimum: 1.0
  reconnect_reconciliation_rate:
    minimum: 1.0
  p95_latency_ms:
    bootstrap_read_maximum: 10000
  model_visible_tool_metadata_bytes:
    record_only_until_live_baseline: true
  estimated_context_tokens:
    record_only_until_live_baseline: true

fault_taxonomy:
  - protocol
  - authentication
  - authorization
  - schema
  - host-policy
  - host-ui
  - selection
  - timeout
  - latency
  - retry
  - cancellation
  - reconnect
  - race
  - privacy
  - server
  - unknown

conclusion_rules:
  documentation_only_is_not_observed_support: true
  declared_without_exercise: declared-unexercised
  account_or_workspace_block: host-policy-blocked
  probe_missing: server-not-implemented
  conflicting_passing_and_failing_runs: unstable
  expired_evidence: expired
  optional_feature_not_promoted: not-applicable
  unsupported_by_v1: unsupported-by-design
  required_case_missing: not-tested

bundle:
  manifest_does_not_contain_bundle_digest: true
  detached_receipt_required: true
  detached_receipt_schema: evaluation-manifest.schema.json#/$defs/bundleReceipt
  evidence_files_include_manifest: true
  evidence_files_exclude_detached_receipt: true

human_observation_required:
  - tool_selection
  - host_confirmation
  - write_entitlement
  - owner_only_result_handling
  - cross_server_behavior

automation_required:
  - protocol_revision
  - discovery_and_metadata
  - result_schema
  - error_schema
  - idempotency
  - cancellation
  - reconnect
  - concurrency
  - latency_and_size

promotion:
  all_required_case_ids_present: true
  attempts_meet_risk_class_minimum: true
  case_manifest_digest_matches: true
  profile_dimensions_complete: true
  evidence_complete_and_redacted: true
  unresolved_conflicting_run_forbidden: true
  reviewer_approval_required: true

phase9_privileged_self_management:
  repository_implementation_may_complete_without_live_host_or_pi_evidence: true
  runtime_promotion: disabled
  runtime_promotion_requires_candidate_pi_evidence: true
  runtime_promotion_requires_real_chatgpt_hc2_evidence: true
  v1_operational_tools_default_visible: false
  host_reboot_contract_absent: true
  category_risk_classes:
    selection_rendering:
      risk_class: tool_selection_and_result_rendering
      minimum_attempts: 10
    confirmation_entitlement:
      risk_class: confirmation_and_entitlement
      minimum_attempts: 5
    execute_retry_cancel:
      risk_class: write_cancellation_retry_cache_confirmation
      minimum_attempts: 20
    concurrency_race_reconnect:
      risk_class: concurrency_race_reconnect_instability
      minimum_attempts: 20

validity:
  maximum_days: 30
  rerun_triggers:
    - chatgpt_product_or_plan_changed
    - workspace_policy_changed
    - connection_or_authentication_changed
    - requested_or_negotiated_revision_changed
    - client_capabilities_changed
    - binnacle_build_or_config_changed
    - mcp_sdk_changed
    - tunnel_or_gateway_changed
    - tool_manifest_changed
    - schemas_or_policy_changed
    - evaluation_profile_or_cases_changed
    - device_os_kernel_or_profile_changed
    - material_regression_observed
