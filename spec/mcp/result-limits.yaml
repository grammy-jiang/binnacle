schema_version: "1.0"
policy_id: binnacle-large-results
policy_version: "1.0.0"
result_schema: schemas/mcp/result-reference.schema.json

limit_resolution:
  effective_limit: minimum-of-all-applicable
  sources:
    - server_build
    - device_profile
    - tool_or_operation_contract
    - information_disclosure_contract
    - current_resource_budget
    - validated_host_profile
    - mcp_revision_and_transport
  host_observation_may_raise_server_limit_automatically: false
  undocumented_host_limit_is_support_evidence: false

bootstrap_limits:
  model_readable_content_bytes: 8192
  structured_content_bytes: 65536
  serialized_tool_result_bytes: 131072
  page_size_default: 100
  page_size_max: 500
  decoded_chunk_bytes_default: 65536
  decoded_chunk_bytes_max: 262144
  retained_result_object_bytes_max: 33554432
  retained_result_bytes_per_controller_max: 268435456
  retained_result_bytes_global_initial: 1073741824
  simultaneous_materializations_per_controller: 4
  simultaneous_materializations_global: 16
  page_or_chunk_requests_per_minute_per_controller: 120

result_modes:
  inline:
    complete_result_required: true
    silent_truncation: forbidden
  item-page:
    immutable_snapshot_required_for_supported_v1: true
    cursor_required_after_first_page: true
    item_identity_required: true
    deterministic_order_required: true
  byte-chunk:
    immutable_complete_object_required: true
    full_digest_required: true
    chunk_digest_required: true
    utf8_boundary_preservation: required-for-text

result_lifecycle:
  states:
    building:
      readable: false
      permitted_next:
        - complete
        - failed
    complete:
      readable: true
      immutable: true
      permitted_next:
        - expired
        - deleted
    failed:
      readable: false
      permitted_next:
        - expired
        - deleted
    expired:
      readable: false
      permitted_next:
        - deleted
    deleted:
      readable: false
      permitted_next: []
  startup_reconstruction_required: true
  in_memory_only_reference_when_retention_promised: forbidden

result_binding:
  required_fields:
    - result_identity_and_schema_version
    - producing_operation_request_tool_and_contract
    - controller_identity_and_epoch
    - device_and_profile
    - query_filter_order_format_fingerprint
    - source_snapshot_boundary
    - information_and_provenance_class
    - recipient_and_result_surface
    - media_type_and_encoding
    - item_and_decoded_byte_counts
    - full_result_digest
    - creation_completion_access_and_expiry
    - retention_class_and_quota_charge
    - policy_and_disclosure_versions
    - audit_identity
  possession_is_authority: false
  access_reauthenticates_controller: true
  access_revalidates_information_policy: true

pagination:
  supported_consistency_for_promotion:
    - immutable_snapshot
  live_unstable:
    supported_for_complete_security_sensitive_traversal: false
    warnings_required: true
    duplication_or_omission_possible_must_be_explicit: true
  cursor:
    opaque: true
    model_visible_non_authoritative: true
    random_server_reference_or_authenticated_token: true
    raw_credential_or_payload: forbidden
    binds:
      - controller_and_device
      - tool_and_contract
      - result_set_and_snapshot
      - normalized_query_fingerprint
      - order_and_tie_breaker
      - page_size_and_next_position
      - information_class_and_recipient
      - expiry_and_policy
      - cursor_format_version
    repeated_same_cursor_same_page: required
    global_mutable_pointer: forbidden
  traversal:
    no_duplicate_logical_item: required
    no_omitted_logical_item: required
    stable_unique_item_identity: required
    explicit_end: required
    next_cursor_null_at_end: required
    cumulative_count: required
  query_change_with_cursor: reject
  page_size_change_with_cursor: reject
  order_change_with_cursor: reject
  projection_change_with_cursor: reject

chunking:
  decoded_offsets: true
  negative_offset: reject
  zero_length: reject
  length_over_max: reject
  range_overflow: reject
  offset_equal_length_behavior: reject-unless-tool-contract-explicitly-permits-empty-final
  text_utf8_split: forbidden
  binary_representation: base64
  base64_expansion_counts_against_serialized_limit: true
  binary_object_over_result_limit: unsupported-unless-separate-artifact-contract

inline_fallback:
  over_inline_limit:
    - retained_result_reference
    - result_too_large
    - result_storage_unavailable
  first_part_claimed_complete: forbidden
  required_metadata:
    - complete
    - returned_items_and_bytes
    - total_counts_when_known
    - omitted_known
    - truncation_and_transformation
    - continuation_available
    - result_or_snapshot_identity_and_digest

mcp_adapters:
  resources:
    status: conditional-on-host-profile
    canonical_fallback:
      - result_get
      - result_page
      - result_chunk
    resource_uri_is_authority: false
    access_revalidation_required: true
  protocol_list_pagination:
    limited_to_corresponding_mcp_list_method: true
    interchangeable_with_result_cursor: false
  streamable_http:
    partial_unbounded_tool_payload_assumed: false
    complete_tool_result_or_reference_required: true
    progress_or_logging_is_final_result: false
    transport_close_deletes_result: false
    transport_close_cancels_operation: false
  tasks:
    result_object_identity_replaced_by_task_handle: false

materialization:
  synchronous_allowed_when_within_call_and_storage_budget: true
  retained_operation_allowed: true
  persist_and_verify_before_return_reference: true
  partial_object_exposed_as_complete: false
  cancellation_partial_result_default: none
  partial_result_requires_separate_contract: true
  resource_limits_required:
    - cpu
    - memory
    - storage
    - source_read
    - output
    - time
    - cancellation

backpressure:
  preserve_reserved_capacity:
    - status
    - cancellation
    - audit
    - safe_stop
    - recovery
  polling_keeps_object_alive_without_limit: false
  fair_scheduling_required: true
  aggressive_client_rate_limited: true
  quota_failure_result: result_storage_unavailable

information:
  never_disclosable_materialized_model_readable: false
  restricted_result_requires_exact_recipient_and_surface: true
  page_or_chunk_may_downgrade_class: false
  other_controller_result_existence_disclosure: false
  raw_refs_in_ordinary_logs_or_metric_labels: false
  audit_safe_digest_only: true

retention_classes:
  RR1-transient:
    minimum_seconds_after_complete: 3600
    examples:
      - synthetic-probe
      - ordinary-bounded-read
  RR2-operation:
    minimum_seconds_after_complete: 86400
    examples:
      - command-output
      - diff
      - logs
      - search
      - operation-evidence
  RR3-audit-or-support:
    minimum_seconds_after_complete: 604800
    source_contract_longer_rule_wins: true
  RR4-uncertain:
    minimum: until-reconciled-plus-86400-seconds
  source_record_may_outlive_payload: true

expiry:
  payload_and_indices_deleted: true
  bounded_tombstone_allowed: true
  automatic_rebuild_on_expired_access: false
  new_snapshot_requires_new_request_and_policy: true
  uncertain_or_security_evidence_evicted_for_ordinary_quota: false

quota_eviction:
  order:
    - expired
    - oldest_eligible_complete
  building_requires_cancellation_or_failure_contract: true
  protected_from_eviction:
    - result_for_uncertain_operation
    - active_recovery_result
    - longer_source_contract
    - audit_security_record
    - idempotency_security_record
  unsafe_quota_recovery:
    new_large_result: reject

error_codes:
  - result_too_large
  - result_storage_unavailable
  - result_not_ready
  - result_failed
  - result_not_found
  - result_expired
  - cursor_invalid
  - cursor_expired
  - snapshot_stale
  - page_size_invalid
  - range_invalid
  - result_integrity_failed
  - result_rate_limited

host_profile:
  lower_observed_limit_overrides_bootstrap: true
  one_successful_large_result_sets_supported_limit: false
  result_limit_probe_required: true
  resources_probe_required_before_dependency: true
  owner_only_field_probe_required: true
  cross_server_limitations_recorded: true
