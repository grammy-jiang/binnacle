schema_version: "1.1"
contract: MCP-LARGE-RESULTS
contract_version: "1.2.0"

limits:
  model_readable_content_bytes_max: 8192
  structured_content_serialized_bytes_max: 65536
  complete_tool_result_serialized_bytes_max: 98304
  inline_data_target_bytes_max: 32768
  item_page_default: 50
  item_page_max: 200
  decoded_chunk_default_bytes: 16384
  decoded_chunk_max_bytes: 32768
  base64_data_string_chars_max: 45000
  retained_result_object_bytes_max: 33554432
  retained_result_objects_per_controller_max: 128
  retained_result_bytes_per_controller_max: 268435456
  access_requests_per_minute_per_controller: 240
  protected_recovery_capacity_bytes: 67108864

effective_limit:
  choose_minimum_of:
    - server_build
    - device_profile
    - tool_contract
    - information_contract
    - resource_budget
    - mcp_revision_transport
    - observed_host_profile
  include_json_framing: true
  include_base64_expansion: true
  include_evidence_and_warnings: true

modes:
  inline:
    retained_reference: false
    lifecycle: complete
    payload_available: true
    materialization_complete: true
    continuation_supported: false
  item-page:
    retained_reference: true
    readable_only_when_lifecycle: complete
    stable_snapshot_required: true
    deterministic_order_required: true
    stable_tie_breaker_required: true
  byte-chunk:
    retained_reference: true
    readable_only_when_lifecycle: complete
    decoded_offset_semantics: true
    utf8_boundary_preservation: true
    binary_representation: base64

lifecycle:
  allowed_transitions:
    building: [complete, failed]
    complete: [expired, deleted]
    failed: [deleted]
    expired: [deleted]
    deleted: []
  building:
    result_get: allowed
    page_or_chunk: result_not_ready
  complete:
    result_get: allowed
    page_or_chunk: allowed_for_declared_mode
  failed:
    result_get: error_metadata_only
    page_or_chunk: result_failed
  expired:
    result_get: tombstone_or_result_expired
    page_or_chunk: result_expired
  deleted:
    result_get: non_disclosing_not_found_or_tombstone
    page_or_chunk: result_not_found

inline_contract:
  complete: true
  continuation_available: false
  result_ref: null
  silent_truncation_forbidden: true

item_page:
  cursor_binds:
    - controller_id_digest
    - controller_epoch
    - device_id
    - device_epoch
    - tool_name
    - contract_version
    - result_ref
    - snapshot_sha256
    - query_filter_projection_sha256
    - ordering_sha256
    - page_size
    - next_position
    - information_class
    - recipient_surface
    - policy_version
    - expires_at
    - cursor_version
  same_cursor_same_page: true
  overlap_or_omission_forbidden: true
  final_page_next_cursor_null: true

byte_chunk:
  offset_is_decoded_bytes: true
  length_is_decoded_bytes: true
  negative_or_overflow_range_rejected: true
  chunk_and_full_digest_required: true
  utf8_sequence_split_forbidden: true
  server_reduces_chunk_to_fit_envelope: true

retention_classes:
  RR1-transient:
    minimum_seconds: 3600
  RR2-operation:
    minimum_seconds: 86400
  RR3-audit-or-support:
    minimum_seconds: 604800
  RR4-uncertain:
    retain_until_reconciled: true
    post_reconciliation_minimum_seconds: 86400

security:
  possession_grants_authority: false
  cross_controller_reuse: forbidden
  information_class_downgrade: forbidden
  raw_reference_in_logs_or_metrics: forbidden
  audit_uses_safe_digest: true
  unauthorized_lookup_is_non_disclosing: true

resources_adapter:
  required_for_v1: false
  promote_only_after_real_host_validation: true
  protocol_list_cursors_not_interchangeable: true

storage_pressure:
  evict_recovery_or_uncertain_payload: forbidden
  new_large_result_when_capacity_unavailable: result_storage_unavailable
  protected_recovery_capacity_reserved: true

phase9_tool_limits:
  runtime_promotion: disabled
  package_inspect:
    mode: inline
    structured_content_serialized_bytes_max: 16384
    item_count_max: 1
  binnacle_service_inspect:
    mode: inline
    structured_content_serialized_bytes_max: 16384
    journal_lines_returned: 0
  restart_preflight:
    mode: inline
    structured_content_serialized_bytes_max: 32768
    reason_codes_max: 20
  binnacle_runtime_inspect:
    mode: inline
    structured_content_serialized_bytes_max: 32768
    protected_paths_or_values_returned: false
  privileged_prepare:
    mode: inline
    structured_content_serialized_bytes_max: 65536
    complete_tool_result_serialized_bytes_max: 98304
    package_transaction_members_max: 64
    complete_prepared_view_required: true
    silent_plan_truncation: forbidden
  package_install:
    mode: inline
    structured_content_serialized_bytes_max: 32768
    raw_package_manager_output_returned: false
  binnacle_service_restart:
    mode: inline
    structured_content_serialized_bytes_max: 32768
    raw_systemd_output_returned: false
  binnacle_restart:
    mode: inline
    structured_content_serialized_bytes_max: 32768
    raw_systemd_or_privileged_output_returned: false
  restricted_recovery:
    safe_fields_only:
      - operation_and_checkpoint_identity
      - candidate_and_lkg_slot_identity_digests
      - last_proven_service_and_runtime_state
      - failed_or_uncertain_action_class
      - bounded_safe_diagnostics
      - static_operator_instruction_code
      - evidence_digest
    reusable_authority_or_raw_privileged_output: forbidden
