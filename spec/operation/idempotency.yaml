schema_version: "1.1"
contract: OPERATION-IDEMPOTENCY
contract_version: "1.1.0"

key_formats:
  caller_key:
    minimum_random_bits: 128
    accepted_encodings:
      - lowercase-hex
      - base64url-no-padding
    uuid_v4_alone_compliant: false
  prepared_execution_nonce:
    server_generated: true
    minimum_random_bits: 128
  derived_member_key:
    requires_declared_parent_contract: true

raw_key_handling:
  persist_raw_key: false
  log_raw_key: false
  metrics_label_raw_key: false
  digest_algorithm: sha256

lookup:
  global_duplicate_prevention_scope:
    - device_id
    - device_epoch
    - tool_name
    - contract_version
    - key_digest
  owner_scope:
    - controller_id
    - controller_epoch
  global_lookup_precedes_owner_disclosure: true
  controller_replacement_cannot_create_duplicate: true
  automatic_owner_transfer: false

request_fingerprint:
  include:
    - tool_name
    - contract_version
    - normalized_effect_inputs
    - prepared_operation_id
    - prepared_input_sha256
    - target_identity
    - maximum_effect
  exclude:
    - current_policy_decision
    - current_observation_freshness
    - mutable_resource_availability
  hash_algorithm: sha256

ordering:
  - authenticate
  - validate_key_syntax
  - create_or_find_global_key_record
  - verify_owner_and_fingerprint
  - policy_and_admission
  - persist_operation_and_reservations
  - consequential_effect
  - persist_effect_knowledge
  - return_response

outcomes:
  same_owner_same_key_same_input: retained_operation
  same_owner_same_key_different_input: idempotency_conflict
  different_controller_matching_key: idempotency_owner_mismatch
  expired_but_tombstoned: idempotency_key_retired
  uncertain_existing_operation: return_uncertain_no_auto_retry
  terminal_existing_operation: return_retained_terminal_result

retention:
  full_record_minimum: maximum_retry_and_reconciliation_window
  tombstone_required: true
  tombstone_fields:
    - key_digest
    - tool_name
    - contract_version
    - owner_controller_digest
    - request_fingerprint
    - terminal_class
    - retired_at
  storage_failure_behavior: reject_new_mutating_work

status:
  owner_authenticated: true
  rate_limited: true
  cross_controller_non_disclosing: true

error_codes:
  - idempotency_conflict
  - idempotency_owner_mismatch
  - idempotency_key_retired
  - idempotency_storage_unavailable
  - prepared_operation_mismatch
  - prepared_operation_expired
