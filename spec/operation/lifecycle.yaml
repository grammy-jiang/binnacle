schema_version: "1.1"
contract: OPERATION-LIFECYCLE
contract_version: "1.1.0"

states:
  received:
    terminality: non_terminal
    effect_knowledge: [none, known_no_effect]
    error_required: false
  rejected:
    terminality: terminal
    effect_knowledge: [none, known_no_effect]
    error_required: true
  authorised:
    terminality: non_terminal
    effect_knowledge: [none, known_no_effect]
    error_required: false
  running:
    terminality: non_terminal
    effect_knowledge: [none, known_no_effect, known_effect, partial]
    error_required: false
  paused:
    terminality: non_terminal
    effect_knowledge: [none, known_no_effect, known_effect, partial]
    error_required: false
  cancelling:
    terminality: non_terminal
    effect_knowledge: [none, known_no_effect, known_effect, partial]
    error_required: false
  cancelled:
    terminality: terminal
    effect_knowledge: [known_no_effect, known_effect, partial]
    error_required: false
    cancellation_phase: verified
    remaining_effects_verified: true
  succeeded:
    terminality: terminal
    effect_knowledge: [known_effect]
    error_required: false
    verification_status: verified
  failed:
    terminality: terminal
    effect_knowledge: [known_no_effect, known_effect, partial]
    error_required: true
  uncertain:
    terminality: effect_terminal_reconcilable
    effect_knowledge: [uncertain]
    error_required: true

allowed_transitions:
  received: [rejected, authorised]
  rejected: []
  authorised: [running, cancelling, cancelled, failed]
  running: [paused, cancelling, succeeded, failed, uncertain]
  paused: [running, cancelling, failed, uncertain]
  cancelling: [cancelled, succeeded, failed, uncertain]
  cancelled: []
  succeeded: []
  failed: []
  uncertain: [succeeded, failed, cancelled]

state_version:
  minimum: 1
  strictly_increases_on_transition: true
  duplicate_observation_may_repeat_same_version: true

progress:
  unknown:
    known: false
    millionths: null
    unit: null
  known:
    known: true
    millionths_range: [0, 1000000]
    unit_required: true
  exact_counts_belong_in_tool_data: true

retry:
  automatic_retry_allowed_for_retained_operation_states: false
  retry_uses_idempotency_contract: true
  uncertain_requires_status_or_reconciliation: true

call_outcome_mapping:
  operation_get_of_failed_operation:
    tool_call_is_error: false
    represented_operation_state: failed
  operation_get_of_uncertain_operation:
    tool_call_is_error: false
    represented_operation_state: uncertain
  malformed_operation_get:
    tool_call_is_error: true

retention:
  terminal_record_required: true
  uncertain_record_protected_until_reconciled: true
  result_expiry_does_not_delete_security_tombstone: true
