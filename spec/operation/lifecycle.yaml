schema_version: "1.0"
contract_id: binnacle-operation-lifecycle
contract_version: "1.0.0"
operation_schema: schemas/mcp/binnacle-common.schema.json#/$defs/operationSnapshot

creation_boundary:
  creates_operation:
    - authenticated_schema_valid_mutating_request_after_idempotency_reservation
    - explicitly_retained_read_or_long_running_request
  does_not_create_operation:
    - transport_failure
    - authentication_failure
    - protocol_failure
    - unknown_tool
    - input_schema_failure

states:
  received:
    terminality: non_terminal
    effect_knowledge:
      - none
      - known_no_effect
    required_timestamps:
      - created_at
      - updated_at
    error_required: false
    forward_effect_allowed: false

  rejected:
    terminality: terminal
    effect_knowledge:
      - none
      - known_no_effect
    required_timestamps:
      - created_at
      - updated_at
      - terminal_or_reconciled_at
    error_required: true
    forward_effect_allowed: false

  authorised:
    terminality: non_terminal
    effect_knowledge:
      - none
      - known_no_effect
    required_timestamps:
      - created_at
      - updated_at
      - authorised_at
    error_required: false
    forward_effect_allowed: true

  running:
    terminality: non_terminal
    effect_knowledge:
      - none
      - known_no_effect
      - known_effect
      - partial
    required_timestamps:
      - created_at
      - updated_at
      - authorised_at
      - started_at
    error_required: false
    forward_effect_allowed: true

  paused:
    terminality: non_terminal
    effect_knowledge:
      - none
      - known_no_effect
      - known_effect
      - partial
    required_timestamps:
      - created_at
      - updated_at
      - authorised_at
      - paused_at
    error_required: false
    forward_effect_allowed: false
    resume_requires:
      - same_operation_identity
      - current_controller_authority
      - current_policy_and_state_revalidation
      - contract_permits_resume

  cancelling:
    terminality: non_terminal
    effect_knowledge:
      - none
      - known_no_effect
      - known_effect
      - partial
      - uncertain
    required_timestamps:
      - created_at
      - updated_at
      - cancelling_at
    cancellation_phase:
      - requested
      - graceful
      - forced
      - unable_to_stop
    forward_effect_allowed: protective_only

  cancelled:
    terminality: terminal
    effect_knowledge:
      - known_no_effect
      - known_effect
      - partial
    required_timestamps:
      - created_at
      - updated_at
      - terminal_or_reconciled_at
    cancellation_phase:
      - verified
    remaining_effects_verified: true
    error_required: false
    forward_effect_allowed: false

  succeeded:
    terminality: terminal
    effect_knowledge:
      - known_no_effect
      - known_effect
    required_timestamps:
      - created_at
      - updated_at
      - terminal_or_reconciled_at
    verification_status: verified
    error_required: false
    forward_effect_allowed: false

  failed:
    terminality: terminal
    effect_knowledge:
      - known_no_effect
      - known_effect
      - partial
    required_timestamps:
      - created_at
      - updated_at
      - terminal_or_reconciled_at
    error_required: true
    forward_effect_allowed: false

  uncertain:
    terminality: effect_terminal_reconcilable
    effect_knowledge:
      - uncertain
    required_timestamps:
      - created_at
      - updated_at
      - terminal_or_reconciled_at
    error_required: true
    automatic_retry_allowed: false
    forward_effect_allowed: false
    permitted_actions:
      - status
      - evidence
      - reconcile
      - cleanup
      - retained_protective_effect

allowed_transitions:
  received:
    - rejected
    - authorised
  rejected: []
  authorised:
    - running
    - cancelling
    - cancelled
    - failed
    - uncertain
  running:
    - paused
    - cancelling
    - succeeded
    - failed
    - uncertain
  paused:
    - running
    - cancelling
    - failed
    - uncertain
  cancelling:
    - cancelled
    - succeeded
    - failed
    - uncertain
  cancelled: []
  succeeded: []
  failed: []
  uncertain:
    - succeeded
    - failed
    - cancelled

transition_requirements:
  received_to_rejected:
    consequential_effect_count: 0
    error_required: true
  received_to_authorised:
    admission_evidence_required: true
  authorised_to_running:
    first_boundary_or_execution_start_recorded: true
  authorised_to_cancelled:
    verified_no_effect: true
  running_to_succeeded:
    success_verification_required: true
  running_to_failed:
    remaining_effects_known: true
  any_to_uncertain:
    reason_and_reconciliation_contract_required: true
  uncertain_to_succeeded:
    no_effect_replay: true
    reconciliation_evidence_required: true
  uncertain_to_failed:
    no_effect_replay: true
    reconciliation_evidence_required: true
  uncertain_to_cancelled:
    no_effect_replay: true
    cancellation_result_verified: true

state_version:
  starts_at: 1
  increment_on:
    - state_change
    - effect_knowledge_change
    - cancellation_phase_change
    - verification_change
    - progress_change
    - retention_change
    - error_change
  stale_snapshot_may_overwrite: false

progress:
  unknown:
    known: false
    completed: 0
    total: null
    unit: null
  known:
    known: true
    completed_min: 0
    total_required: true
    completed_must_not_exceed_total: true
    unit_required_when_total_present: true

retry:
  same_identity_same_fingerprint: return_or_advance_retained_lifecycle_only
  same_identity_different_fingerprint: idempotency_conflict
  new_identity_after_uncertain_same_effect: reconciliation_required
  automatic_non_idempotent_repeat: false

cancellation:
  request_is_terminal_result: false
  acknowledgement_is_cancelled_state: false
  cancelled_requires_verified_remaining_effects: true
  cancellation_request_retry_is_idempotent: true

verification:
  success_requires_verified: true
  failure_may_be_verified_or_unavailable_with_known_effects: true
  uncertain_may_not_claim_verified_effect: true

retention:
  non_terminal_and_uncertain_auto_expiry: forbidden
  terminal_result_compaction: allowed_under_retention_contract
  tombstone_must_prevent_replay: true
  storage_failure_blocks_new_affected_mutation: true
