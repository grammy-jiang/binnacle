schema_version: "1.1"
policy_id: capability-composition
policy_version: "1.2.0"

zones:
  control-plane:
    model_visible: false
  observation:
    model_visible: true
  untrusted-content:
    model_visible: conditionally
  protected-data:
    model_visible: false
  local-mutation:
    model_visible: false
  credential-broker:
    model_visible: false
  mediated-egress:
    model_visible: false
  hardware-effect:
    model_visible: false
  privileged-broker:
    model_visible: false
    authority_source: authenticated_peer_exact_ticket_and_protected_profile
  model-visible-result:
    model_visible: true
    authority_source: explicit_information_contract

forbidden_edges:
  - from: untrusted-content
    to: control-plane
  - from: protected-data
    to: model-visible-result
  - from: protected-data
    to: mediated-egress
  - from: credential-broker
    to: untrusted-content
  - from: credential-broker
    to: model-visible-result
  - from: untrusted-content
    to: hardware-effect
  - from: untrusted-content
    to: local-mutation
    unless: exact_prepared_operation
  - from: untrusted-content
    to: mediated-egress
    unless: exact_prepared_operation
  - from: untrusted-content
    to: privileged-broker
    unless: exact_privileged_preparation_phase4_operation_and_broker_ticket
  - from: local-mutation
    to: privileged-broker
    unless: exclusive_workspace_change_guard_and_durable_mutation_fence
  - from: privileged-broker
    to: model-visible-result
    unless: exact_information_contract_and_sanitized_bounded_evidence

server_data_reference:
  required_fields:
    - reference_id
    - source_type
    - source_identity
    - source_sha256
    - integrity_status
    - provenance
    - information_class
    - transformations
    - controller_id_digest
    - device_id
    - created_at
    - expires_at
    - allowed_recipient
    - allowed_surface
  possession_grants_authority: false

prepared_operation:
  required_fields:
    - prepared_operation_id
    - execution_nonce_digest
    - controller_id_digest
    - device_id
    - tool_name
    - contract_version
    - source_reference_ids
    - source_digests
    - transformation
    - effective_destination
    - information_class
    - maximum_bytes
    - policy_version
    - profile_version
    - created_at
    - expires_at
  exact_match_required: true
  current_state_revalidation_required: true
  semantic_intent_is_not_a_field: true

command_run:
  network_authority: profile-defined
  bootstrap_development_application_network: allowed
  listener_bind_default: loopback
  non_loopback_listener_requires_explicit_exposure: true
  raw_credentials_available: false
  credential_helpers_available: false
  device_access_available: false
  local_control_sockets_available: false
  raw_packet_network_available: false
  network_admin_available: false
  protected_data_egress_requires_exact_contract: true
  credential_bearing_effect_requires_dedicated_operation: true

credential_broker:
  raw_secret_export: false
  required_bindings:
    - credential_identity
    - audience
    - action
    - effective_destination
    - source_data_digest
    - maximum_effect
    - expiry

mediated_egress:
  destination_dimensions:
    - scheme
    - normalized_host
    - resolved_ip_ranges
    - port
    - method
    - normalized_path
    - query_parameter_names
    - query_parameter_value_constraints
    - redirect_policy
    - proxy_policy
    - maximum_request_bytes
    - maximum_response_bytes
  reject_unlisted_query_parameters: true
  reject_userinfo: true
  reject_fragments: true
  revalidate_after_redirect: true
  detect_dns_rebinding: true
  dlp_required_for_restricted_result: true
  record_actual_destination: true

information_classes:
  never-disclosable:
    model_visible: false
    egress: false
  restricted-result:
    model_visible_only_with_exact_contract: true
    egress_only_with_exact_contract: true
  normal-result:
    model_visible_with_policy: true

policy_change:
  version_type: semver-string
  affected_preparations_invalidated: true

host_boundary:
  cross_server_after_normal_model_disclosure: not_locally_enforceable
  restricted_data_requires_owner_only_or_validated_host_contract: true

privileged_self_management_extension:
  extension_version: "1.0.0"
  runtime_promotion: disabled
  observations:
    zone: observation
    tools:
      - package_inspect
      - binnacle_service_inspect
      - restart_preflight
      - binnacle_runtime_inspect
  preparation:
    zone: control-plane
    tool: privileged_prepare
    effect: no_effect
    grants_authority: false
  consequential_tools:
    zone: privileged-broker
    tools:
      - package_install
      - binnacle_service_restart
      - binnacle_restart
    exact_preparation_required: true
    exact_phase4_operation_required: true
    exact_broker_ticket_required: true
    exact_protected_profile_required: true
    raw_model_text_or_manifest_annotation_grants_authority: false
  fixed_targets:
    systemd_unit: binnacle-dev.service
    runtime_selector: /srv/binnacle-runtime/current
    package_names: protected_profile_only
  denied_surfaces:
    - arbitrary_root_command
    - arbitrary_root_path
    - arbitrary_systemd_unit
    - arbitrary_package_option
    - raw_systemd_or_package_output
    - raw_credentials
    - protected_configuration_values
    - host_reboot
