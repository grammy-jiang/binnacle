schema_version: "1.1"
policy_id: command-execution
policy_version: "1.2.0"

architecture:
  policy_process_separate: true
  narrow_execution_broker_separate: true
  unprivileged_executor_separate: true
  direct_subprocess_fallback: false

broker_ticket:
  single_use: true
  required_fields:
    - ticket_id
    - operation_id
    - controller_id_digest
    - device_id
    - command_profile_id
    - executable_identity
    - argv_sha256
    - stdin_sha256
    - stdin_reference_sha256
    - workspace_script_sha256
    - workspace_root_identity
    - mount_plan_sha256
    - environment_sha256
    - policy_sha256
    - resource_plan_sha256
    - sandbox_plan_sha256
    - workspace_write_bytes_max
    - workspace_inode_count_max
    - expires_at
    - admission_record_id
    - single_use_nonce
  optional_input_digest_fields_use_null_when_absent: true
  revalidate_all_input_digests_at_admission: true

filesystem:
  canonical_workspace_root_required: true
  fail_closed_on_path_or_mount_ambiguity: true
  control_plane_visible: false
  credentials_visible: false
  audit_and_recovery_visible: false
  binnacle_executable_state_visible: false
  arbitrary_host_mounts_visible: false
  per_file_size_max: 16777216
  workspace_write_bytes_max: 134217728
  workspace_inode_count_max: 4096
  private_tmp_bytes_max: 67108864

network:
  default: denied
  ipv4: denied
  ipv6: denied
  dns: denied
  unix_sockets: denied
  inherited_sockets: denied
  protected_control_plane_ipc: denied
  raw_packet: denied
  network_admin: denied
  mediated_egress_only: true
  listener_bind:
    loopback: denied
    non_loopback: denied
    explicit_exposure_required: true

devices:
  default: denied
  arbitrary_device_nodes: denied

credentials:
  raw_credentials: denied
  credential_helpers: denied
  inherited_agents: denied

privilege:
  dedicated_unprivileged_identity: true
  no_new_privileges: true
  ambient_capabilities: none
  inheritable_capabilities: none
  setuid_setgid_gain: denied
  ptrace_outside_sandbox: denied
  bpf: denied
  kernel_keyring: denied
  advanced_syscall_policy:
    bootstrap_required: false
    target_hardening: true
  mandatory_access_control:
    bootstrap_required: false
    target_hardening: true

resources:
  descendant_wide: true
  cpu_time_seconds_max: 600
  wall_time_seconds_max: 900
  memory_bytes_max: 1073741824
  swap_bytes_max: 0
  pids_max: 256
  open_files_max: 1024
  stdout_stderr_bytes_max: 16777216
  retained_result_bytes_max: 33554432

cleanup:
  graceful_then_forced: true
  descendants_verified: true
  mounts_and_namespaces_verified: true
  temporary_resources_verified_or_quarantined: true
  cleanup_failure_is_not_cancelled: true

profiles:
  workspace-general-v1:
    command_run_visible: true
    command_run_allowed: true
    structured_argv_only: true
    network:
      mode: application
      ipv4: allowed
      ipv6: allowed
      dns: allowed
      unix_sockets: denied
      inherited_sockets: denied
      protected_control_plane_ipc: denied
      raw_packet: denied
      network_admin: denied
      mediated_egress_only: false
      listener_bind:
        loopback: allowed
        non_loopback: explicit
        explicit_exposure_required: true
    inherits_global_devices: true
    inherits_global_credentials: true
    workspace_write_bytes_max: 134217728
    workspace_inode_count_max: 4096

  workspace-check-v1:
    inherits: workspace-general-v1
    command_run_visible: true
    command_run_allowed: true
    allowed_executables:
      - python
      - pytest
      - ruff
      - mypy
      - git
    workspace_write_bytes_max: 33554432
    workspace_inode_count_max: 1024
    wall_time_seconds_max: 300

  self-management:
    command_run_visible: false
    command_run_allowed: false
    dedicated_self_management_tools_required: true
