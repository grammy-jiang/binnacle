schema_version: "1.1"
contract: HOST-CONFIRMATION-PROFILE
contract_version: "1.1.0"
authority_boundary:
  server_verifiable_owner_click: false
  local_policy_remains_authoritative: true
  model_text_creates_authority: false
  annotations_create_authority: false
  unsupported_when_host_profile_fails: true

classes:
  HC0:
    confirmation_required: false
    preparation_required: false
    permitted_contracts:
      - bounded-normal-result-observation
      - synthetic-no-effect-probe
      - sanitized-normal-result-evidence
  HC1:
    confirmation_required: true
    preparation_required: true
    required_view_fields:
      - device_id
      - tool_name
      - contract_version
      - normalized_arguments
      - target
      - maximum_effect
      - information_class
      - destination
      - expiry
      - cancellation_and_recovery
    retry_requires_same_idempotency_identity: true
  HC2:
    inherits: HC1
    additional_fields:
      - privilege
      - destructive_effect
      - external_effective_destination
      - credential_use
      - audit_or_recovery_impact
  HC3:
    inherits: HC2
    additional_fields:
      - hardware_identity
      - electrical_or_physical_limits
      - verified_interlocks
      - safe_state
      - emergency_boundary

initial_tool_classification:
  binnacle_probe: HC0
  system_inspect: HC0
  probe_result_formats: HC0
  probe_error: HC0
  compatibility_report: HC0
  probe_workspace_prepare: HC0
  probe_workspace_write: HC1
  probe_workspace_cleanup: HC1

information_rules:
  normal-result:
    minimum_class: HC0
  restricted-result:
    minimum_class: HC1
  never-disclosable:
    model_visible: false
    confirmation_cannot_override: true

compatibility_report_exception:
  enabled: false
  rationale: compatibility_report_v1_1_is_normal_result

prepare_execute:
  prepare_tool: probe_workspace_prepare
  execute_tools:
    - probe_workspace_write
    - probe_workspace_cleanup
  prepared_operation_id_required: true
  execution_nonce_required: true
  expiry_required: true
  exact_input_match_required: true
  current_state_revalidation_required: true
  preparation_is_owner_authority: false

non_bypassable_routes:
  - direct_tool_call
  - cached_metadata
  - batch
  - grouped_invocation
  - mcp_task
  - mrtr_retry
  - reconnect
  - another_conversation
  - argument_substitution
  - device_substitution

profile_promotion:
  requires_real_chatgpt_observation: true
  requires_positive_and_negative_cases: true
  requires_decline_dismiss_timeout_cases: true
  requires_fatigue_and_grouping_cases: true
  compromised_host_is_residual_risk: true

retry:
  same_key_same_input: return_retained_operation
  same_key_different_input: reject_idempotency_conflict
  expired_preparation: reject_prepared_operation_expired
  uncertain_operation: query_or_reconcile_only
