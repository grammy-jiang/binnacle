schema_version: "1.1"
contract: RELEASE-SUPPLY-CHAIN
contract_version: "1.1.0"

release_envelope:
  canonical_payload: payload
  canonicalization: rfc8785-jcs
  payload_digest_location: integrity.payload_sha256
  signatures_location: integrity.signatures
  payload_must_not_contain_own_digest: true
  payload_must_not_contain_signatures: true

approved_sources:
  source_commit_immutable: true
  source_archive_digest_required: true
  component_lock_required: true
  mutable_package_ranges_forbidden: true
  unrecorded_local_patch_forbidden: true

required_component_kinds:
  - mcp-sdk
  - python-runtime
  - binnacle-server
  - execution-broker
  - sandbox
  - updater
  - schema
  - policy
  - tool-manifest

hosted_service:
  fabricated_artifact_digest_forbidden: true
  local_agent_digest_required: true
  service_identity_evidence_required: true
  residual_risk_and_fallback_required: true

sbom_documents:
  required_exactly_once:
    - source_build
    - runtime
    - deployed_inventory
  deployed_inventory_compared_at_startup: true

provenance:
  signed: true
  source_and_resolved_inputs_bound: true
  output_artifact_digests_bound: true
  sbom_digests_bound: true
  builder_identity_and_isolation_bound: true

reproducibility:
  RB0:
    supported_release_allowed: false
  RB1:
    requirement: resolved_inputs_recorded
  RB2:
    requirement: same_controlled_builder_reproduces_artifact_digest
  RB3:
    requirement: independent_builder_reproduces_artifact_digest
  claim_may_not_exceed_evidence: true

security_gates:
  required:
    - source-vulnerability
    - dependency-vulnerability
    - exploitability-exposure
    - secret-scan
    - malware-artifact
    - license
    - end-of-life
    - protocol-regression
    - schema-regression
    - metadata-regression
    - isolation-regression
    - audit-regression
    - idempotency-regression
    - host-compatibility
  stale_scan_behavior: fail
  failed_gate_without_active_exception: fail

security_exception:
  required_fields:
    - exception_id
    - finding_ids
    - affected_builds
    - affected_profiles
    - affected_components
    - exploitability_analysis
    - exposure_analysis
    - accepted_residual_risk
    - reason
    - owner
    - approver
    - remediation_owner
    - monitoring_controls
    - forced_retirement_triggers
    - created_at
    - remediation_deadline
    - expires_at
    - status
  expiry_mandatory: true
  expired_exception_effect: gate_failed
  missing_monitoring_or_retirement_trigger_effect: gate_failed

signing:
  runtime_self_signature_not_independent: true
  release_signer_separate_from_runtime: true
  verify_before_install: true
  verify_at_startup: true
  verify_payload_and_all_artifact_digests: true

update:
  ordinary_command_run_forbidden: true
  stages:
    - verify_envelope
    - stage_without_activation
    - isolated_migration_and_checks
    - canary_health_and_compatibility
    - atomic_activation
    - post_activation_verification
    - stability_window
  rollback_state_retained_until_stability_window: true
  migration_failure_keeps_old_release: true
  post_activation_failure_triggers_rollback_or_recovery: true

retirement:
  restricted_build_disables_affected_capabilities: true
  forced_retirement_supported: true
  recovery_evidence_preserved: true

startup_drift:
  compare_deployed_inventory: true
  unexpected_executable_or_dependency: restricted_startup
  policy_schema_manifest_drift: restricted_startup
