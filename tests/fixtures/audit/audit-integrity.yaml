schema_version: "1.1"
contract: AUDIT-EVIDENCE
contract_version: "1.1.0"

canonical_event: &canonical_event
  schema_version: "1.1"
  canonicalization: rfc8785-jcs+sha256-v1
  event_id: event-1
  stream_id: audit-main
  audit_epoch: epoch-1
  segment_id: segment-1
  sequence: 1
  recorded_at: "2026-08-08T15:00:00Z"
  monotonic_ns: 1000
  boot_id: boot-1
  device_id: pi-a
  server_build_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  tool_manifest_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  schema_registry_sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
  device_profile_version: "1.0.0"
  policy_version: "1.1.0"
  severity: info
  source: remote_controller
  controller_id_digest: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
  request_id: request-1
  operation_id: null
  idempotency_digest: null
  prepared_operation_id: null
  correlation_ids: []
  information_class: normal-result
  provenance: server-fact
  redaction_policy_version: "1.1.0"
  payload:
    kind: request.received
    mcp_revision: "2026-07-28"
    method: tools/call
    tool_name: binnacle_probe
    input_digest: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
    body_bytes: 256
    outcome: accepted
  previous_event_hash: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
  event_hash: 1111111111111111111111111111111111111111111111111111111111111111
  previous_checkpoint_digest: null
  checkpoint_ref: null
  export_ref: null
  safe_facts:
    - name: tool_count
      value: 8
      classification: normal-result

cases:
  - id: canonical-event-schema-valid
    kind: positive
    event: *canonical_event
    expect:
      schema_valid: true

  - id: safe-facts-mapping-invalid
    kind: negative
    event:
      <<: *canonical_event
      safe_facts:
        tool_count: 8
    expect:
      schema_valid: false

  - id: event-type-payload-mismatch-not-representable
    kind: positive
    event: *canonical_event
    expect:
      top_level_event_type_present: false
      authoritative_event_type: request.received

  - id: unknown-payload-kind
    kind: negative
    event:
      <<: *canonical_event
      payload:
        kind: authentication.succeeded
        effect_type: command
        target_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    expect:
      schema_valid: false

  - id: safe-fact-string-bounded
    kind: negative
    event:
      <<: *canonical_event
      safe_facts:
        - name: output_excerpt
          value: "<2049-character-string>"
          classification: normal-result
    generated_string_length: 2049
    expect:
      schema_valid: false

  - id: total-event-byte-limit
    kind: negative
    canonical_event_bytes: 65537
    expect:
      policy_valid: false
      append_permitted: false

  - id: rfc8785-equivalent-objects-same-hash
    kind: positive
    logical_event_variants:
      - object_key_order: forward
        number_rendering: canonical
        whitespace: compact
      - object_key_order: reverse
        number_rendering: alternate_input_same_value
        whitespace: pretty
    expect:
      canonical_bytes_equal: true
      hashes_equal: true

  - id: non-i-json-number-rejected
    kind: negative
    safe_fact_value: NaN
    expect:
      canonicalization_allowed: false

  - id: event-bit-change-detected
    kind: negative
    stored_event_hash_valid_before_mutation: true
    mutation:
      path: safe_facts[0].value
      from: 8
      to: 9
    expect:
      verification: failed

  - id: event-insertion-detected
    kind: negative
    sequence_chain: [1, 2, 2, 3]
    expect:
      verification: failed
      reason: duplicate_or_forked_sequence

  - id: event-deletion-detected
    kind: negative
    sequence_chain: [1, 3]
    expect:
      verification: failed
      reason: sequence_gap

  - id: event-reorder-detected
    kind: negative
    sequence_chain: [1, 3, 2]
    expect:
      verification: failed

  - id: local-checkpoint-continuity
    kind: positive
    checkpoints:
      - stream_id: audit-main
        audit_epoch: epoch-1
        first_sequence: 1
        last_sequence: 100
        checkpoint_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        previous_checkpoint_digest: null
      - stream_id: audit-main
        audit_epoch: epoch-1
        first_sequence: 101
        last_sequence: 200
        checkpoint_digest: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        previous_checkpoint_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    expect:
      continuity_valid: true

  - id: external-signer-equivocation
    kind: negative
    receipts:
      - stream_id: audit-main
        audit_epoch: epoch-1
        first_sequence: 1
        last_sequence: 100
        checkpoint_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        signature_valid: true
      - stream_id: audit-main
        audit_epoch: epoch-1
        first_sequence: 1
        last_sequence: 100
        checkpoint_digest: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        signature_valid: true
    expect:
      verification: failed
      reason: audit_checkpoint_equivocation
      both_histories_accepted: false

  - id: external-checkpoint-missing-previous
    kind: negative
    prior_accepted_checkpoint_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    next_receipt:
      previous_checkpoint_digest: null
      signature_valid: true
    expect:
      verification: failed
      reason: checkpoint_continuity_missing

  - id: secret-redacted-before-hash
    kind: positive
    source_event:
      authorization_header: Bearer secret-token
      tool_name: binnacle_probe
    persisted_event:
      authorization_header_present: false
      safe_facts:
        - name: tool_name
          value: binnacle_probe
          classification: normal-result
    expect:
      secret_in_persisted_bytes: false
      secret_in_hash_preimage: false

  - id: raw-idempotency-key-forbidden
    kind: negative
    persisted_safe_fact:
      name: idempotency_key
      value: 00112233445566778899aabbccddeeff
      classification: restricted-result
    expect:
      policy_valid: false
      digest_only_required: true

  - id: retention-ar4-consistent-key
    kind: positive
    retention_class: AR4
    policy_field: minimum_days
    expected_minimum_days: 365
    expect:
      evaluator_field_resolves: true

  - id: disk-full-fails-restricted
    kind: negative
    audit_storage:
      append_possible: false
      emergency_journal_possible: true
    request:
      consequential: true
    expect:
      operation_admitted: false
      audit_storage_degraded_event_recorded: true

  - id: emergency-journal-exhausted
    kind: negative
    audit_storage:
      append_possible: false
      emergency_journal_possible: false
    expect:
      mode: fail_restricted
      new_consequential_work: blocked

  - id: tool-evidence-projection-valid
    kind: positive
    evidence:
      evidence_id: evidence-1
      recorded_at: "2026-08-08T15:00:00Z"
      source: system-inspection
      provenance: server-observed
      information_class: normal-result
      fresh_until: "2026-08-08T15:01:00Z"
      result_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      operation_id: null
      audit_ref: event-1
      facts:
        - name: hostname
          value: pi-a
          classification: normal-result
    expect:
      common_mcp_evidence_schema_valid: true
