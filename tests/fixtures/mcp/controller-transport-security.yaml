schema_version: "1.1"
contract: CONTROLLER-TRANSPORT-SECURITY
contract_version: "1.1.0"

profiles:
  oauth_resource_server:
    required_claims:
      - iss
      - aud
      - sub
      - exp
      - iat
      - scope
    conditional_claims:
      - client_id
      - workspace_id
      - cnf
  trusted_gateway_assertion:
    required_claims:
      - assertion_profile
      - assertion_version
      - iss
      - aud
      - sub
      - client_id
      - workspace_id
      - scope
      - iat
      - exp
      - jti
      - kid
      - alg
      - transport_binding
      - signature

cases:
  - id: oauth-valid-controller
    kind: positive
    authentication:
      profile: oauth_resource_server
      token_claims:
        iss: https://auth.example.test
        aud: https://pi.example.test/mcp
        sub: controller-owner
        client_id: chatgpt-client
        workspace_id: personal-workspace
        iat: 1786200000
        exp: 1786200300
        scope: "mcp:read"
        cnf:
          jkt: sha256-thumbprint
      signature_valid: true
      issuer_metadata_current: true
      revocation_status: active
    expect:
      authenticated_controller: controller-owner
      dispatch_allowed: true

  - id: gateway-valid-controller
    kind: positive
    authentication:
      profile: trusted_gateway_assertion
      assertion:
        assertion_profile: binnacle-gateway-assertion
        assertion_version: "1.0"
        iss: https://gateway.example.test
        aud: https://pi.example.test/mcp
        sub: controller-owner
        client_id: chatgpt-client
        workspace_id: personal-workspace
        scope: "mcp:read mcp:write-probe"
        iat: 1786200000
        exp: 1786200060
        jti: assertion-0001
        kid: gateway-key-2026-08
        alg: EdDSA
        transport_binding: tls-exporter-sha256:abc123
        signature: detached-signature
      signature_valid: true
      trusted_gateway_key: true
      replay_cache_contains_jti: false
    expect:
      authenticated_controller: controller-owner
      replay_cache_records_jti: assertion-0001
      dispatch_allowed: true

  - id: gateway-missing-profile
    kind: negative
    based_on: gateway-valid-controller
    mutation:
      remove: authentication.assertion.assertion_profile
    expect:
      http_status: 401
      error: invalid_gateway_assertion
      dispatch_allowed: false

  - id: gateway-missing-version
    kind: negative
    based_on: gateway-valid-controller
    mutation:
      remove: authentication.assertion.assertion_version
    expect:
      http_status: 401
      error: invalid_gateway_assertion
      dispatch_allowed: false

  - id: gateway-missing-issued-at
    kind: negative
    based_on: gateway-valid-controller
    mutation:
      remove: authentication.assertion.iat
    expect:
      http_status: 401
      error: invalid_gateway_assertion
      dispatch_allowed: false

  - id: gateway-missing-jti
    kind: negative
    based_on: gateway-valid-controller
    mutation:
      remove: authentication.assertion.jti
    expect:
      http_status: 401
      error: invalid_gateway_assertion
      dispatch_allowed: false

  - id: gateway-missing-key-id
    kind: negative
    based_on: gateway-valid-controller
    mutation:
      remove: authentication.assertion.kid
    expect:
      http_status: 401
      error: invalid_gateway_assertion
      dispatch_allowed: false

  - id: gateway-missing-algorithm
    kind: negative
    based_on: gateway-valid-controller
    mutation:
      remove: authentication.assertion.alg
    expect:
      http_status: 401
      error: invalid_gateway_assertion
      dispatch_allowed: false

  - id: gateway-replay
    kind: negative
    based_on: gateway-valid-controller
    mutation:
      set:
        authentication.replay_cache_contains_jti: true
    expect:
      http_status: 401
      error: replay_detected
      dispatch_allowed: false

  - id: wrong-audience
    kind: negative
    based_on: oauth-valid-controller
    mutation:
      set:
        authentication.token_claims.aud: https://other.example.test/mcp
    expect:
      http_status: 401
      challenge_present: true
      dispatch_allowed: false

  - id: insufficient-scope
    kind: negative
    authentication:
      based_on: oauth-valid-controller
    request:
      required_scope: mcp:write-probe
    expect:
      http_status: 403
      challenge_present: true
      tool_result_created: false

  - id: authenticated-local-policy-rejection
    kind: positive
    authentication:
      based_on: gateway-valid-controller
    local_policy:
      write_probe_enabled: false
    request:
      tool: probe_workspace_write
      arguments:
        name: policy-check.txt
        content: bounded
        idempotency_key: 00112233445566778899aabbccddeeff
        prepared_operation_id: prep-policy-check
        execution_nonce: nonce-policy-check
    expect:
      http_status: 200
      tool_is_error: true
      error_code: policy_rejected
      authentication_succeeded: true
      schema_validation_succeeded: true
      effect_occurred: false

  - id: same-controller-retry-reconciles
    kind: positive
    setup:
      retained_operation:
        operation_id: op-1
        controller_identity: controller-owner
        idempotency_key_digest: digest-key-1
        request_fingerprint: digest-input-1
        state: running
    request:
      controller_identity: controller-owner
      operation_id: op-1
      idempotency_key: 00112233445566778899aabbccddeeff
      request_fingerprint: digest-input-1
    expect:
      result: retained_operation
      operation_id: op-1
      new_effect: false

  - id: other-controller-retry-denied-without-duplicate
    kind: negative
    setup:
      retained_operation:
        operation_id: op-1
        controller_identity: controller-owner
        idempotency_key_digest: digest-key-1
        request_fingerprint: digest-input-1
        state: uncertain
    request:
      controller_identity: replacement-controller
      operation_id: op-1
      idempotency_key: 00112233445566778899aabbccddeeff
      request_fingerprint: digest-input-1
    expect:
      result: idempotency_owner_mismatch
      new_effect: false
      operation_details_disclosed: false

  - id: tunnel-source-ip-is-not-identity
    kind: negative
    authentication:
      tunnel_connected: true
      source_ip_allowlisted: true
      verified_token_or_assertion: false
    expect:
      http_status: 401
      dispatch_allowed: false

  - id: inbound-token-passthrough-forbidden
    kind: negative
    request:
      downstream_action: true
      proposed_downstream_credential: inbound_mcp_bearer_token
    expect:
      result: rejected
      downstream_request_sent: false

  - id: cross-origin-cookie-request
    kind: negative
    transport:
      origin: https://attacker.example
      cookies_present: true
      cors_preflight_authorized: false
    expect:
      http_status: 403
      dispatch_allowed: false
