schema_version: "1.1"
contract: HOST-CONFIRMATION-PROFILE
contract_version: "1.2.0"

cases:
  - id: hc0-binnacle-probe
    kind: positive
    tool: binnacle_probe
    confirmation_class: HC0
    host_confirmation_shown: false
    expect:
      profile_gate: pass
      local_policy_still_required: true

  - id: hc0-sanitized-compatibility-report
    kind: positive
    tool: compatibility_report
    confirmation_class: HC0
    information_class: normal-result
    output_contains_reusable_authentication: false
    expect:
      profile_gate: pass

  - id: hc0-restricted-result-forbidden
    kind: negative
    tool: hypothetical_restricted_read
    confirmation_class: HC0
    information_class: restricted-result
    expect:
      profile_gate: fail
      error: confirmation_class_too_low

  - id: prepare-write-valid
    kind: positive
    tool: probe_workspace_prepare
    confirmation_class: HC0
    request:
      operation: write
      relative_path: test.txt
      content_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      byte_count: 4
    expect:
      prepared_operation_id: prep-1
      execution_nonce_present: true
      effect_occurred: false

  - id: hc1-write-valid
    kind: positive
    tool: probe_workspace_write
    confirmation_class: HC1
    preparation:
      prepared_operation_id: prep-1
      execution_nonce: AAAAAAAAAAAAAAAAAAAAAA
      exact_arguments_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      expires_at: "2026-08-08T16:00:00Z"
    host_observation:
      exact_view_shown: true
      owner_confirmed: true
      bypass_route_available: false
      shown_fields:
        - device_id
        - tool_name
        - contract_version
        - normalized_arguments
        - target
        - maximum_effect
        - information_class
        - destination
        - expiry
        - cancellation_and_recovery
    execution:
      prepared_operation_id: prep-1
      execution_nonce: AAAAAAAAAAAAAAAAAAAAAA
      arguments_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      idempotency_key: 00112233445566778899aabbccddeeff
    expect:
      profile_gate: pass
      server_authority_source: local_policy
      confirmation_is_server_proof: false

  - id: hc1-direct-call-bypass
    kind: negative
    tool: probe_workspace_write
    confirmation_class: HC1
    execution:
      prepared_operation_id: null
      execution_nonce: null
      idempotency_key: 00112233445566778899aabbccddeeff
    expect:
      profile_gate: fail
      server_result: prepared_operation_required
      effect_occurred: false

  - id: hc1-stale-preparation
    kind: negative
    tool: probe_workspace_write
    confirmation_class: HC1
    preparation:
      prepared_operation_id: prep-expired
      execution_nonce: BBBBBBBBBBBBBBBBBBBBBB
      expires_at: "2026-08-08T15:00:00Z"
    execution_time: "2026-08-08T15:01:00Z"
    expect:
      profile_gate: fail
      server_result: prepared_operation_expired
      effect_occurred: false

  - id: hc1-argument-substitution
    kind: negative
    tool: probe_workspace_write
    confirmation_class: HC1
    preparation:
      prepared_operation_id: prep-2
      execution_nonce: CCCCCCCCCCCCCCCCCCCCCC
      exact_arguments_sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    execution:
      arguments_sha256: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
    expect:
      profile_gate: fail
      server_result: prepared_operation_mismatch
      effect_occurred: false

  - id: hc1-device-substitution
    kind: negative
    tool: probe_workspace_write
    confirmation_class: HC1
    preparation:
      device_id: pi-a
    execution:
      device_id: pi-b
    expect:
      profile_gate: fail
      effect_occurred: false

  - id: hc1-declined
    kind: negative
    tool: probe_workspace_write
    confirmation_class: HC1
    host_observation:
      exact_view_shown: true
      owner_confirmed: false
      disposition: declined
    expect:
      profile_gate: fail
      execute_request_sent: false

  - id: hc1-dismissed
    kind: negative
    tool: probe_workspace_cleanup
    confirmation_class: HC1
    host_observation:
      disposition: dismissed
    expect:
      profile_gate: fail
      execute_request_sent: false

  - id: hc1-timeout
    kind: negative
    tool: probe_workspace_cleanup
    confirmation_class: HC1
    host_observation:
      disposition: timeout
    expect:
      profile_gate: fail
      execute_request_sent: false

  - id: batch-finite-valid
    kind: positive
    confirmation_class: HC1
    batch:
      finite: true
      aggregate_maximum_effect_shown: true
      members:
        - prepared_operation_id: prep-a
          tool: probe_workspace_write
        - prepared_operation_id: prep-b
          tool: probe_workspace_cleanup
    expect:
      profile_gate: pass
      each_member_requires_exact_match: true

  - id: batch-open-ended-invalid
    kind: negative
    confirmation_class: HC1
    batch:
      finite: false
      description: approve future workspace operations
    expect:
      profile_gate: fail
      error: open_ended_confirmation_unsupported

  - id: mcp-task-does-not-bypass-confirmation
    kind: negative
    tool: probe_workspace_write
    confirmation_class: HC1
    route: mcp_task
    host_confirmation_shown: false
    expect:
      profile_gate: fail
      effect_occurred: false

  - id: retry-lost-response
    kind: positive
    tool: probe_workspace_write
    confirmation_class: HC1
    setup:
      retained_operation:
        operation_id: op-1
        idempotency_key_digest: digest-key-1
        state: succeeded
    retry:
      same_idempotency_key: true
      same_input: true
    expect:
      operation_id: op-1
      new_effect: false
      new_confirmation_required_for_reconciliation: false

  - id: fatigue-distinct-effects-remain-distinct
    kind: negative
    confirmation_class: HC1
    host_observation:
      prompts:
        - target: a.txt
          maximum_effect: create-a
        - target: b.txt
          maximum_effect: delete-b
      displayed_as_indistinguishable_repetition: true
    expect:
      profile_gate: fail
      error: confirmation_fatigue_obscures_distinct_effects

  - id: hc2-privileged-restart-valid
    kind: positive
    tool: binnacle_restart
    confirmation_class: HC2
    preparation:
      prepare_tool: privileged_prepare
      prepared_operation_id: prep-privileged-1
      execution_nonce: DDDDDDDDDDDDDDDDDDDDDD
      exact_state_binding_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      candidate_slot_identity_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      lkg_slot_identity_sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    host_observation:
      exact_view_shown: true
      owner_confirmed: true
      shown_additional_fields:
        - privilege
        - destructive_effect
        - external_effective_destination
        - credential_use
        - audit_or_recovery_impact
    expect:
      profile_gate: pass
      preparation_is_server_authority: false
      exact_local_policy_ticket_and_broker_acceptance_still_required: true

  - id: hc2-privileged-preparation-is-not-confirmation
    kind: negative
    tool: package_install
    confirmation_class: HC2
    preparation:
      prepare_tool: privileged_prepare
      prepared_operation_id: prep-privileged-2
      exact_view_available: true
    host_observation:
      owner_confirmed: false
    expect:
      profile_gate: fail
      execute_request_sent: false
      broker_acceptance_created: false
