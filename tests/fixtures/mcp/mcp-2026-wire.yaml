schema_version: "1.1"
contract: MCP-2026-WIRE
contract_version: "1.1.0"
revision: "2026-07-28"

common_request_meta: &common_request_meta
  io.modelcontextprotocol/protocolVersion: "2026-07-28"
  io.modelcontextprotocol/clientInfo:
    name: chatgpt-probe
    version: "1.0.0"
  io.modelcontextprotocol/clientCapabilities: {}

cases:
  - id: discover-valid
    kind: positive
    request:
      http_headers:
        MCP-Protocol-Version: "2026-07-28"
        Mcp-Method: server/discover
      body:
        jsonrpc: "2.0"
        id: 1
        method: server/discover
        params:
          _meta: *common_request_meta
    wire_result:
      resultType: complete
      capabilities:
        tools: {}
        extensions: {}
      instructions: Binnacle operates one Raspberry Pi deterministically.
      ttlMs: 0
      cacheScope: private
      _meta:
        io.modelcontextprotocol/serverInfo:
          name: binnacle
          version: "0.1.0"
    expect:
      schema_valid: true
      top_level_serverInfo_present: false

  - id: discover-top-level-server-info-invalid
    kind: negative
    wire_result:
      resultType: complete
      serverInfo:
        name: binnacle
        version: "0.1.0"
      capabilities:
        tools: {}
      ttlMs: 0
      cacheScope: private
    expect:
      schema_valid: false
      failure_layer: target_wire_schema

  - id: tools-list-valid
    kind: positive
    request:
      http_headers:
        MCP-Protocol-Version: "2026-07-28"
        Mcp-Method: tools/list
      body:
        jsonrpc: "2.0"
        id: 2
        method: tools/list
        params:
          _meta: *common_request_meta
    wire_result:
      resultType: complete
      ttlMs: 0
      cacheScope: private
      tools:
        - name: binnacle_probe
          title: Probe Binnacle connectivity
          description: Return bounded server, device, and protocol facts.
          inputSchema:
            type: object
            additionalProperties: false
          outputSchema:
            $ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/binnacle_probe.output.v1_1
          annotations:
            readOnlyHint: true
            destructiveHint: false
            idempotentHint: true
            openWorldHint: false
    expect:
      schema_valid: true
      deterministic_order: true
      legacy_execution_field_present: false

  - id: target-tool-legacy-execution-invalid
    kind: negative
    wire_result:
      resultType: complete
      ttlMs: 0
      cacheScope: private
      tools:
        - name: binnacle_probe
          description: probe
          inputSchema:
            type: object
          execution:
            taskSupport: optional
    expect:
      schema_valid: false
      failure_layer: target_tool_schema

  - id: tools-list-private-cache-required
    kind: negative
    setup:
      catalogue_varies_by_authorization: true
    wire_result:
      resultType: complete
      ttlMs: 60000
      cacheScope: public
      tools: []
    expect:
      product_contract_valid: false
      error: authorization_sensitive_cache_must_be_private

  - id: tool-call-success-valid
    kind: positive
    request:
      http_headers:
        MCP-Protocol-Version: "2026-07-28"
        Mcp-Method: tools/call
        Mcp-Name: binnacle_probe
      body:
        jsonrpc: "2.0"
        id: 3
        method: tools/call
        params:
          name: binnacle_probe
          arguments: {}
          _meta: *common_request_meta
    wire_result:
      resultType: complete
      isError: false
      content:
        - type: text
          text: Binnacle is reachable.
      structuredContent:
        schema_version: "1.1"
        call_status: succeeded
        tool:
          name: binnacle_probe
          contract_version: "1.1"
        request_id: request-3
        data: {}
        operation: null
        evidence: []
        warnings: []
    expect:
      schema_valid: true
      model_readable_content_present: true

  - id: execution-error-valid
    kind: positive
    wire_result:
      resultType: complete
      isError: true
      content:
        - type: text
          text: Local policy rejected the requested operation.
      structuredContent:
        schema_version: "1.1"
        call_status: execution_error
        tool:
          name: probe_workspace_write
          contract_version: "1.1"
        request_id: request-4
        error:
          code: policy_rejected
          message: Write probe is disabled by local policy.
          retryable: false
          details: {}
        operation: null
        evidence: []
        warnings: []
    expect:
      schema_valid: true
      model_readable_content_present: true

  - id: execution-error-missing-content
    kind: negative
    wire_result:
      resultType: complete
      isError: true
      content: []
      structuredContent:
        schema_version: "1.1"
        call_status: execution_error
        tool:
          name: probe_workspace_write
          contract_version: "1.1"
        request_id: request-5
        error:
          code: policy_rejected
          message: rejected
          retryable: false
          details: {}
        operation: null
        evidence: []
        warnings: []
    expect:
      product_contract_valid: false
      error: model_readable_content_required

  - id: structured-output-schema-mismatch
    kind: negative
    wire_result:
      resultType: complete
      isError: false
      content:
        - type: text
          text: Probe completed.
      structuredContent:
        wrong_field: true
    declared_output_schema: schemas/mcp/bootstrap-outputs.schema.json#/$defs/binnacle_probe.output.v1_1
    expect:
      schema_valid: false
      response_sent: false

  - id: missing-result-type
    kind: negative
    wire_result:
      isError: false
      content:
        - type: text
          text: Probe completed.
      structuredContent: {}
    expect:
      schema_valid: false
      failure_layer: target_wire_schema

  - id: mrtr-without-capability
    kind: negative
    request:
      http_headers:
        MCP-Protocol-Version: "2026-07-28"
        Mcp-Method: tools/call
        Mcp-Name: probe_workspace_prepare
      body:
        jsonrpc: "2.0"
        id: 6
        method: tools/call
        params:
          name: probe_workspace_prepare
          arguments:
            operation: write
            name: test.txt
            content_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          _meta: *common_request_meta
    wire_result:
      resultType: input_required
      inputRequests: {}
    expect:
      schema_valid: false
      error: undeclared_client_capability

  - id: tasks-extension-not-negotiated
    kind: negative
    request:
      http_headers:
        MCP-Protocol-Version: "2026-07-28"
        Mcp-Method: tools/call
        Mcp-Name: binnacle_probe
      body:
        jsonrpc: "2.0"
        id: 7
        method: tools/call
        params:
          name: binnacle_probe
          arguments: {}
          _meta: *common_request_meta
    wire_result:
      resultType: task
      task:
        taskId: task-1
        status: working
    expect:
      schema_valid: false
      error: extension_not_negotiated
