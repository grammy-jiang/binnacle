schema_version: "1.1"
contract: MCP-LARGE-RESULTS
contract_version: "1.1.0"

cases:
  - id: inline-complete-valid
    kind: positive
    metadata:
      result_ref: null
      lifecycle: complete
      delivery_mode: inline
      payload_available: true
      materialization_complete: true
      continuation_supported: false
      media_type: application/json
      encoding: json-items
      item_count: 2
      decoded_byte_count: 100
      result_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      created_at: "2026-08-08T15:00:00Z"
      completed_at: "2026-08-08T15:00:00Z"
      expires_at: "2026-08-08T16:00:00Z"
      information_class: normal-result
    expect:
      schema_valid: true

  - id: inline-with-result-ref-invalid
    kind: negative
    metadata:
      result_ref: retained-result-ref-123456
      lifecycle: complete
      delivery_mode: inline
      payload_available: true
      materialization_complete: true
      continuation_supported: false
    expect:
      schema_valid: false

  - id: retained-building-page-not-ready
    kind: positive
    metadata:
      result_ref: retained-result-ref-123456
      lifecycle: building
      delivery_mode: item-page
      payload_available: false
      materialization_complete: false
      continuation_supported: true
    request:
      tool: result_page
    expect:
      tool_is_error: true
      error_code: result_not_ready

  - id: item-page-complete-envelope-valid
    kind: positive
    tool_result:
      schema_version: "1.1"
      call_status: succeeded
      tool:
        name: result_page
        contract_version: "1.1"
      request_id: request-page-1
      data:
        result:
          result_ref: retained-result-ref-123456
          lifecycle: complete
          delivery_mode: item-page
          payload_available: true
          materialization_complete: true
          continuation_supported: true
          media_type: application/json
          encoding: json-items
          item_count: 3
          decoded_byte_count: 300
          result_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          created_at: "2026-08-08T15:00:00Z"
          completed_at: "2026-08-08T15:00:01Z"
          expires_at: "2026-08-09T15:00:00Z"
          information_class: normal-result
        snapshot_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        page_sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        items:
          - id: 1
          - id: 2
        returned_count: 2
        total_count: 3
        next_cursor: next-cursor-1234567890123456
        end_of_results: false
      operation: null
      evidence: []
      warnings: []
    expect:
      output_schema: resultPageOutput
      schema_valid: true

  - id: page-output-inner-data-only-invalid
    kind: negative
    tool_result:
      result:
        lifecycle: complete
        delivery_mode: item-page
      items: []
    expect:
      output_schema_valid: false
      error: canonical_tool_envelope_required

  - id: final-page-next-cursor-null
    kind: positive
    page:
      end_of_results: true
      next_cursor: null
    expect:
      schema_valid: true

  - id: nonfinal-page-needs-cursor
    kind: negative
    page:
      end_of_results: false
      next_cursor: null
    expect:
      schema_valid: false

  - id: reconstruct-pages-no-overlap-or-omission
    kind: positive
    snapshot_items: [1, 2, 3, 4, 5]
    pages:
      - cursor: start
        items: [1, 2]
        next_cursor: cursor-2-1234567890123456
      - cursor: cursor-2-1234567890123456
        items: [3, 4]
        next_cursor: cursor-4-1234567890123456
      - cursor: cursor-4-1234567890123456
        items: [5]
        next_cursor: null
    expect:
      reconstructed_items: [1, 2, 3, 4, 5]
      duplicates: []
      omissions: []

  - id: same-cursor-same-page
    kind: positive
    cursor: cursor-2-1234567890123456
    requests: 2
    expect:
      page_sha256_identical: true
      global_cursor_advanced: false

  - id: concurrent-source-mutation-does-not-change-snapshot
    kind: positive
    snapshot_created: true
    source_mutation_after_snapshot: true
    expect:
      pagination_uses_original_snapshot: true
      snapshot_sha256_unchanged: true

  - id: cross-controller-cursor
    kind: negative
    cursor_owner: controller-a
    requesting_controller: controller-b
    expect:
      tool_is_error: true
      error_code: result_not_found
      result_existence_disclosed: false

  - id: expired-cursor
    kind: negative
    cursor_expires_at: "2026-08-08T15:00:00Z"
    request_time: "2026-08-08T15:00:01Z"
    expect:
      error_code: cursor_expired

  - id: byte-chunk-complete-envelope-valid
    kind: positive
    tool_result:
      schema_version: "1.1"
      call_status: succeeded
      tool:
        name: result_chunk
        contract_version: "1.1"
      request_id: request-chunk-1
      data:
        result:
          result_ref: retained-result-ref-abcdef
          lifecycle: complete
          delivery_mode: byte-chunk
          payload_available: true
          materialization_complete: true
          continuation_supported: true
          media_type: text/plain
          encoding: utf-8
          item_count: null
          decoded_byte_count: 100
          result_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          created_at: "2026-08-08T15:00:00Z"
          completed_at: "2026-08-08T15:00:01Z"
          expires_at: "2026-08-09T15:00:00Z"
          information_class: normal-result
        offset: 0
        decoded_byte_count: 5
        representation: utf-8
        data: hello
        chunk_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        next_offset: 5
        end_of_result: false
        utf8_boundary_adjusted: false
      operation: null
      evidence: []
      warnings: []
    expect:
      output_schema: resultChunkOutput
      schema_valid: true

  - id: decoded-chunk-default-fits-envelope
    kind: positive
    decoded_chunk_bytes: 16384
    representation: base64
    expected_base64_chars_max: 21848
    structured_content_bytes_max: 65536
    expect:
      complete_envelope_fits: true

  - id: decoded-chunk-max-reduced-when-envelope-overhead-large
    kind: positive
    requested_decoded_bytes: 32768
    computed_serialized_envelope_bytes: 70000
    effective_structured_content_bytes_max: 65536
    expect:
      server_reduces_returned_decoded_bytes: true
      returned_envelope_bytes_at_most: 65536

  - id: decoded-chunk-over-limit
    kind: negative
    requested_decoded_bytes: 32769
    expect:
      error_code: range_invalid

  - id: utf8-boundary-adjustment
    kind: positive
    text: "a😀b"
    requested_offset: 1
    requested_length: 2
    expect:
      invalid_utf8_returned: false
      utf8_boundary_adjusted: true

  - id: binary-base64-digest
    kind: positive
    decoded_bytes_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    encoded_representation: base64
    expect:
      chunk_digest_calculated_over_decoded_bytes: true

  - id: chunk-digest-mismatch
    kind: negative
    expected_chunk_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    actual_chunk_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    expect:
      error_code: result_integrity_failed
      data_presented_as_valid: false

  - id: result-get-building-envelope
    kind: positive
    tool: result_get
    result_lifecycle: building
    expect:
      tool_call_is_error: false
      payload_available: false

  - id: result-get-failed
    kind: positive
    tool: result_get
    result_lifecycle: failed
    expect:
      tool_is_error: true
      error_code: result_failed

  - id: result-expired
    kind: negative
    result_lifecycle: expired
    expect:
      error_code: result_expired
      payload_disclosed: false

  - id: storage-unavailable-no-silent-truncation
    kind: negative
    inline_result_fits: false
    retained_storage_available: false
    expect:
      error_code: result_storage_unavailable
      partial_payload_marked_complete: false

  - id: model-readable-field-name-consistent
    kind: positive
    policy_field: model_readable_content_bytes_max
    value: 8192
    expect:
      documentation_field_matches: true
      fixture_field_matches: true

  - id: resources-adapter-unvalidated
    kind: positive
    host_profile_resources_status: not-tested
    expect:
      canonical_retrieval_tools_required: true
      resource_uri_emitted: false

  - id: restricted-result-no-model-downgrade
    kind: negative
    retained_information_class: restricted-result
    requested_projection: normal-result
    expect:
      result: rejected
      information_class_preserved: restricted-result

  - id: per-controller-quota
    kind: negative
    retained_bytes_before: 268435456
    requested_new_bytes: 1
    expect:
      error_code: result_quota_exceeded

  - id: uncertain-recovery-result-not-evicted
    kind: positive
    retention_class: RR4-uncertain
    storage_pressure: true
    reconciled: false
    expect:
      evicted: false
      new_large_result_rejected_if_needed: true
