schema_version: "1.1"
contract: MCP-REVISION-SUPPORT
contract_version: "1.1.0"
fixture_shape:
  request_headers_field: http_headers
  request_body_field: body
  expected_field: expect

cases:
  - id: modern-discover-valid
    revision: "2026-07-28"
    kind: positive
    request:
      http_headers:
        MCP-Protocol-Version: "2026-07-28"
        Mcp-Method: server/discover
      body:
        jsonrpc: "2.0"
        id: 1
        method: server/discover
        params:
          _meta:
            io.modelcontextprotocol/protocolVersion: "2026-07-28"
            io.modelcontextprotocol/clientInfo:
              name: chatgpt-probe
              version: "1.0.0"
            io.modelcontextprotocol/clientCapabilities: {}
    expect:
      http_status: 200
      dispatch_revision: "2026-07-28"
      result_type: complete

  - id: modern-tool-call-valid
    revision: "2026-07-28"
    kind: positive
    request:
      http_headers:
        MCP-Protocol-Version: "2026-07-28"
        Mcp-Method: tools/call
        Mcp-Name: binnacle_probe
      body:
        jsonrpc: "2.0"
        id: 2
        method: tools/call
        params:
          name: binnacle_probe
          arguments: {}
          _meta:
            io.modelcontextprotocol/protocolVersion: "2026-07-28"
            io.modelcontextprotocol/clientInfo:
              name: chatgpt-probe
              version: "1.0.0"
            io.modelcontextprotocol/clientCapabilities: {}
    expect:
      http_status: 200
      handler: binnacle_probe
      result_type: complete

  - id: modern-method-header-mismatch
    revision: "2026-07-28"
    kind: negative
    request:
      http_headers:
        MCP-Protocol-Version: "2026-07-28"
        Mcp-Method: tools/list
      body:
        jsonrpc: "2.0"
        id: 3
        method: tools/call
        params:
          name: binnacle_probe
          arguments: {}
          _meta:
            io.modelcontextprotocol/protocolVersion: "2026-07-28"
            io.modelcontextprotocol/clientInfo:
              name: chatgpt-probe
              version: "1.0.0"
            io.modelcontextprotocol/clientCapabilities: {}
    expect:
      http_status: 400
      jsonrpc_error_code: -32020
      error_code: protocol_header_mismatch
      tool_dispatched: false

  - id: modern-name-header-mismatch
    revision: "2026-07-28"
    kind: negative
    request:
      http_headers:
        MCP-Protocol-Version: "2026-07-28"
        Mcp-Method: tools/call
        Mcp-Name: system_inspect
      body:
        jsonrpc: "2.0"
        id: 4
        method: tools/call
        params:
          name: binnacle_probe
          arguments: {}
          _meta:
            io.modelcontextprotocol/protocolVersion: "2026-07-28"
            io.modelcontextprotocol/clientInfo:
              name: chatgpt-probe
              version: "1.0.0"
            io.modelcontextprotocol/clientCapabilities: {}
    expect:
      http_status: 400
      jsonrpc_error_code: -32020
      error_code: protocol_header_mismatch
      tool_dispatched: false

  - id: modern-unsupported-version
    revision: "2026-01-01"
    kind: negative
    request:
      http_headers:
        MCP-Protocol-Version: "2026-01-01"
        Mcp-Method: tools/list
      body:
        jsonrpc: "2.0"
        id: 5
        method: tools/list
        params: {}
    expect:
      http_status: 400
      jsonrpc_error_code: -32021
      error_code: unsupported_protocol_version

  - id: task-shape-cross-era
    revision: "2026-07-28"
    kind: negative
    request:
      http_headers:
        MCP-Protocol-Version: "2026-07-28"
        Mcp-Method: tools/call
        Mcp-Name: binnacle_probe
      body:
        jsonrpc: "2.0"
        id: 6
        method: tools/call
        params:
          name: binnacle_probe
          arguments: {}
          _meta:
            io.modelcontextprotocol/protocolVersion: "2026-07-28"
            io.modelcontextprotocol/clientInfo:
              name: chatgpt-probe
              version: "1.0.0"
            io.modelcontextprotocol/clientCapabilities:
              extensions: {}
      injected_response:
        task:
          taskId: legacy-task
          status: working
    expect:
      result: conformance_failure
      failure_layer: target_result_schema
      request_envelope_valid: true

  - id: transport-disconnect-cancellation-modern
    revision: "2026-07-28"
    kind: positive
    setup:
      retained_operation:
        operation_id: op-modern-1
        state: running
    request:
      http_headers:
        MCP-Protocol-Version: "2026-07-28"
        Mcp-Method: tools/call
        Mcp-Name: operation_cancel
      body:
        jsonrpc: "2.0"
        id: 7
        method: tools/call
        params:
          name: operation_cancel
          arguments:
            operation_id: op-modern-1
          _meta:
            io.modelcontextprotocol/protocolVersion: "2026-07-28"
            io.modelcontextprotocol/clientInfo:
              name: chatgpt-probe
              version: "1.0.0"
            io.modelcontextprotocol/clientCapabilities: {}
    expect:
      request_envelope_valid: true
      cancellation_layer: binnacle_operation
      result_type: complete
      transport_disconnect_alone_cancels: false

  - id: legacy-2025-11-25-initialize
    revision: "2025-11-25"
    kind: positive
    request:
      body:
        jsonrpc: "2.0"
        id: 10
        method: initialize
        params:
          protocolVersion: "2025-11-25"
          capabilities: {}
          clientInfo:
            name: chatgpt-probe
            version: "1.0.0"
    expect:
      negotiated_revision: "2025-11-25"
      initialized_session: true

  - id: legacy-2025-11-25-cancellation
    revision: "2025-11-25"
    kind: positive
    setup:
      initialized_session:
        session_id: session-11
        negotiated_revision: "2025-11-25"
      in_flight_request_id: 11
    request:
      http_headers:
        MCP-Protocol-Version: "2025-11-25"
        Mcp-Session-Id: session-11
      body:
        jsonrpc: "2.0"
        method: notifications/cancelled
        params:
          requestId: 11
          reason: test cancellation
    expect:
      transport_request_cancellation_observed: true
      retained_operation_cancelled_without_operation_cancel: false

  - id: legacy-post-init-missing-version
    revision: "2025-11-25"
    kind: negative
    setup:
      initialized_session:
        session_id: session-12
        negotiated_revision: "2025-11-25"
    request:
      http_headers:
        Mcp-Session-Id: session-12
      body:
        jsonrpc: "2.0"
        id: 12
        method: tools/list
        params: {}
    expect:
      http_status: 400
      dispatch: rejected_before_method

  - id: modern-session-header-forbidden
    revision: "2026-07-28"
    kind: negative
    request:
      http_headers:
        MCP-Protocol-Version: "2026-07-28"
        Mcp-Method: tools/list
        Mcp-Session-Id: legacy-session
      body:
        jsonrpc: "2.0"
        id: 13
        method: tools/list
        params:
          _meta:
            io.modelcontextprotocol/protocolVersion: "2026-07-28"
            io.modelcontextprotocol/clientInfo:
              name: chatgpt-probe
              version: "1.0.0"
            io.modelcontextprotocol/clientCapabilities: {}
    expect:
      http_status: 400
      dispatch: cross_era_rejected

  - id: legacy-target-result-type-forbidden
    revision: "2025-06-18"
    kind: negative
    setup:
      initialized_session:
        session_id: session-18
        negotiated_revision: "2025-06-18"
    response:
      resultType: complete
      tools: []
    expect:
      result: conformance_failure
      failure_layer: legacy_result_schema
