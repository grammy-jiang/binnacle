schema_version: "1.1"
contract: MCP-SCHEMAS
contract_version: "1.2.0"

schema_registry:
  common: schemas/mcp/binnacle-common.schema.json
  inputs: schemas/mcp/bootstrap-inputs.schema.json
  outputs: schemas/mcp/bootstrap-outputs.schema.json

cases:
  - id: all-bootstrap-definitions-present
    kind: positive
    expected_inputs:
      - binnacle_probe.input.v1_1
      - system_inspect.input.v1_1
      - probe_result_formats.input.v1_1
      - probe_error.input.v1_1
      - compatibility_report.input.v1_1
      - probe_workspace_prepare.input.v1_1
      - probe_workspace_write.input.v1_1
      - probe_workspace_cleanup.input.v1_1
      - privileged_prepare.input.v1_0
      - package_inspect.input.v1_0
      - package_install.input.v1_0
      - binnacle_service_inspect.input.v1_0
      - binnacle_service_restart.input.v1_0
      - restart_preflight.input.v1_0
      - binnacle_restart.input.v1_0
      - binnacle_runtime_inspect.input.v1_0
    expected_outputs:
      - binnacle_probe.output.v1_1
      - system_inspect.output.v1_1
      - probe_result_formats.output.v1_1
      - probe_error.output.v1_1
      - compatibility_report.output.v1_1
      - probe_workspace_prepare.output.v1_1
      - probe_workspace_write.output.v1_1
      - probe_workspace_cleanup.output.v1_1
      - privileged_prepare.output.v1_0
      - package_inspect.output.v1_0
      - package_install.output.v1_0
      - binnacle_service_inspect.output.v1_0
      - binnacle_service_restart.output.v1_0
      - restart_preflight.output.v1_0
      - binnacle_restart.output.v1_0
      - binnacle_runtime_inspect.output.v1_0
    expect:
      all_present: true

  - id: empty-probe-valid
    kind: positive
    schema: binnacle_probe.input.v1_1
    instance: {}
    expect:
      valid: true

  - id: empty-probe-additional-property
    kind: negative
    schema: binnacle_probe.input.v1_1
    instance:
      unexpected: true
    expect:
      valid: false

  - id: bounded-delay-requires-delay
    kind: negative
    schema: probe_error.input.v1_1
    instance:
      case: bounded_delay
    expect:
      valid: false

  - id: non-delay-rejects-delay
    kind: negative
    schema: probe_error.input.v1_1
    instance:
      case: policy_rejection
      delay_ms: 100
    expect:
      valid: false

  - id: prepare-write-valid
    kind: positive
    schema: probe_workspace_prepare.input.v1_1
    instance:
      operation: write
      relative_path: nested/test.txt
      content_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      byte_count: 4
    expect:
      valid: true

  - id: prepare-cleanup-valid
    kind: positive
    schema: probe_workspace_prepare.input.v1_1
    instance:
      operation: cleanup
      relative_path: nested/test.txt
      content_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      artifact_id: artifact-1
    expect:
      valid: true

  - id: prepare-write-artifact-invalid
    kind: negative
    schema: probe_workspace_prepare.input.v1_1
    instance:
      operation: write
      relative_path: test.txt
      content_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      byte_count: 4
      artifact_id: artifact-1
    expect:
      valid: false

  - id: write-valid-text
    kind: positive
    schema: probe_workspace_write.input.v1_1
    instance:
      prepared_operation_id: prep-1
      execution_nonce: AAAAAAAAAAAAAAAAAAAAAA
      idempotency_key: 00112233445566778899aabbccddeeff
      relative_path: test.txt
      text: test
      overwrite: false
    expect:
      valid: true

  - id: write-requires-preparation
    kind: negative
    schema: probe_workspace_write.input.v1_1
    instance:
      idempotency_key: 00112233445566778899aabbccddeeff
      relative_path: test.txt
      text: test
      overwrite: false
    expect:
      valid: false

  - id: write-text-and-base64-exclusive
    kind: negative
    schema: probe_workspace_write.input.v1_1
    instance:
      prepared_operation_id: prep-1
      execution_nonce: AAAAAAAAAAAAAAAAAAAAAA
      idempotency_key: 00112233445566778899aabbccddeeff
      relative_path: test.txt
      text: test
      base64: dGVzdA==
      overwrite: false
    expect:
      valid: false

  - id: absolute-path-invalid
    kind: negative
    schema: probe_workspace_write.input.v1_1
    instance:
      prepared_operation_id: prep-1
      execution_nonce: AAAAAAAAAAAAAAAAAAAAAA
      idempotency_key: 00112233445566778899aabbccddeeff
      relative_path: /etc/passwd
      text: test
      overwrite: false
    expect:
      valid: false

  - id: traversal-path-invalid
    kind: negative
    schema: probe_workspace_write.input.v1_1
    instance:
      prepared_operation_id: prep-1
      execution_nonce: AAAAAAAAAAAAAAAAAAAAAA
      idempotency_key: 00112233445566778899aabbccddeeff
      relative_path: ../escape
      text: test
      overwrite: false
    expect:
      valid: false

  - id: backslash-path-invalid
    kind: negative
    schema: probe_workspace_write.input.v1_1
    instance:
      prepared_operation_id: prep-1
      execution_nonce: AAAAAAAAAAAAAAAAAAAAAA
      idempotency_key: 00112233445566778899aabbccddeeff
      relative_path: "..\\escape"
      text: test
      overwrite: false
    expect:
      valid: false

  - id: drive-path-invalid
    kind: negative
    schema: probe_workspace_write.input.v1_1
    instance:
      prepared_operation_id: prep-1
      execution_nonce: AAAAAAAAAAAAAAAAAAAAAA
      idempotency_key: 00112233445566778899aabbccddeeff
      relative_path: "C:\\temp\\file"
      text: test
      overwrite: false
    expect:
      valid: false

  - id: cleanup-single-artifact-valid
    kind: positive
    schema: probe_workspace_cleanup.input.v1_1
    instance:
      prepared_operation_id: prep-2
      execution_nonce: BBBBBBBBBBBBBBBBBBBBBB
      idempotency_key: ffeeddccbbaa99887766554433221100
      relative_path: test.txt
      artifact_id: artifact-1
      content_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    expect:
      valid: true

  - id: privileged-prepare-package-valid
    kind: positive
    schema: privileged_prepare.input.v1_0
    instance:
      action: package_install
      target_profile_id: development-packages
      package_target:
        name: ripgrep
        architecture: arm64
        requested_version: 14.1.1-1
    expect:
      valid: true

  - id: privileged-prepare-action-substitution-invalid
    kind: negative
    schema: privileged_prepare.input.v1_0
    instance:
      action: binnacle_service_restart
      target_profile_id: development-service
      package_target:
        name: ripgrep
        architecture: arm64
    expect:
      valid: false

  - id: controlled-restart-missing-complete-bindings-invalid
    kind: negative
    schema: binnacle_restart.input.v1_0
    instance:
      prepared_operation_id: prep-phase9
      execution_nonce: CCCCCCCCCCCCCCCCCCCCCC
      idempotency_key: 00112233445566778899aabbccddeeff
      preflight_state_binding_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    expect:
      valid: false

  - id: success-envelope-requires-operation-field
    kind: negative
    schema: binnacle_probe.output.v1_1
    instance:
      schema_version: "1.1"
      call_status: succeeded
      tool:
        name: binnacle_probe
        contract_version: "1.1"
      request_id: request-1
      data: {}
      evidence: []
      warnings: []
    expect:
      valid: false

  - id: success-envelope-requires-warnings-field
    kind: negative
    schema: binnacle_probe.output.v1_1
    instance:
      schema_version: "1.1"
      call_status: succeeded
      tool:
        name: binnacle_probe
        contract_version: "1.1"
      request_id: request-1
      data: {}
      operation: null
      evidence: []
    expect:
      valid: false

  - id: uncertain-auto-retry-invalid
    kind: negative
    schema: common.operationSnapshot
    instance_overrides:
      state: uncertain
      terminality: effect_terminal_reconcilable
      effect_knowledge: uncertain
      retry:
        automatic_retry_allowed: true
    expect:
      valid: false

  - id: failed-status-call-is-success
    kind: positive
    tool_call:
      isError: false
      call_status: succeeded
    represented_operation:
      state: failed
    expect:
      valid: true
