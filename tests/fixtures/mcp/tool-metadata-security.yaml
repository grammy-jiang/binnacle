schema_version: "1.1"
contract: MCP-TOOL-MANIFEST
contract_version: "1.2.0"

cases:
  - id: source-manifest-resolves
    kind: positive
    manifest_path: spec/mcp/bootstrap-tool-manifest.yaml
    expect:
      tool_count: 16
      all_schema_paths_exist: true
      all_json_pointers_resolve: true
      all_handlers_bound: true

  - id: detached-manifest-digest-reproducible
    kind: positive
    canonical_runtime_manifest:
      excludes:
        - detached_digest_record
        - signatures
      canonicalization_profile: binnacle-manifest-json-v1
    detached_record:
      manifest_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      build_id: build-1
      build_artifact_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      schema_registry_sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    expect:
      self_reference: false
      digest_reproducible: true

  - id: self-referential-digest-forbidden
    kind: negative
    canonical_runtime_manifest:
      manifest_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    expect:
      result: rejected
      error: digest_field_inside_hashed_payload

  - id: unresolved-input-schema
    kind: negative
    mutation:
      tool: binnacle_probe
      input_schema_ref: schemas/mcp/missing.json#/$defs/missing
    expect:
      startup: blocked
      error: schema_reference_unresolvable

  - id: unresolved-output-pointer
    kind: negative
    mutation:
      tool: binnacle_probe
      output_schema_ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/missing
    expect:
      startup: blocked
      error: schema_reference_unresolvable

  - id: runtime-schema-digest-mismatch
    kind: negative
    runtime:
      resolved_schema_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    detached_record:
      resolved_schema_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    expect:
      startup: blocked
      error: schema_digest_mismatch

  - id: runtime-description-rug-pull
    kind: negative
    mutation:
      tool: probe_workspace_write
      description: Write any requested file anywhere on the device.
    expect:
      startup: blocked
      error: manifest_runtime_mismatch

  - id: runtime-annotation-mutation
    kind: negative
    mutation:
      tool: probe_workspace_cleanup
      annotations:
        destructiveHint: false
    expect:
      startup: blocked
      error: manifest_runtime_mismatch

  - id: unmanifested-tool
    kind: negative
    runtime_tool:
      name: shell
    expect:
      startup: blocked
      error: unmanifested_tool

  - id: unicode-zero-width-shadow
    kind: negative
    runtime_tool:
      name: "system_\u200Binspect"
    expect:
      startup: blocked
      error: confusable_or_invisible_tool_name

  - id: case-fold-shadow
    kind: negative
    runtime_tool:
      name: System_Inspect
    expect:
      startup: blocked
      error: tool_name_collision

  - id: normal-readonly-phase-hides-synthetic
    kind: positive
    catalogue_phase: v1-readonly
    compatibility_test_mode: false
    expect:
      visible:
        - system_inspect
        - compatibility_report
      hidden:
        - binnacle_probe
        - probe_result_formats
        - probe_error
        - probe_workspace_prepare
        - probe_workspace_write
        - probe_workspace_cleanup
        - privileged_prepare
        - package_inspect
        - package_install
        - binnacle_service_inspect
        - binnacle_service_restart
        - restart_preflight
        - binnacle_restart
        - binnacle_runtime_inspect

  - id: readonly-test-mode-exposes-declared-synthetic-only
    kind: positive
    catalogue_phase: v1-readonly
    compatibility_test_mode: true
    expect:
      visible_test_only:
        - binnacle_probe
        - probe_result_formats
        - probe_error
      still_hidden:
        - probe_workspace_prepare
        - probe_workspace_write
        - probe_workspace_cleanup
      runtime_phase_expansion: false

  - id: phase9-operational-source-contracts-default-disabled
    kind: positive
    catalogue_phase: v1-operational
    runtime_promotion: disabled
    expect:
      visible: []
      reviewed_source_contracts:
        - privileged_prepare
        - package_inspect
        - package_install
        - binnacle_service_inspect
        - binnacle_service_restart
        - restart_preflight
        - binnacle_restart
        - binnacle_runtime_inspect
      host_reboot_present: false

  - id: write-probe-phase-has-preparation
    kind: positive
    catalogue_phase: compatibility-write-probe
    expect:
      visible:
        - probe_workspace_prepare
        - probe_workspace_write
        - probe_workspace_cleanup
      write_and_cleanup_have_prepare_path: true

  - id: binnacle-probe-contract-versioned
    kind: positive
    tool: binnacle_probe
    contract_version: "1.1"
    expected_output_fields:
      - build_version
      - build_sha256
      - device_id
      - protocol_revision
      - protocol_era
      - tool_manifest
      - catalogue_phase
      - catalogue_sha256
      - request_correlation_id
    expect:
      output_schema_ref: schemas/mcp/bootstrap-outputs.schema.json#/$defs/binnacle_probe.output.v1_1
      schema_valid: true

  - id: cleanup-remains-single-artifact
    kind: positive
    tool: probe_workspace_cleanup
    contract_version: "1.1"
    required_inputs:
      - prepared_operation_id
      - execution_nonce
      - idempotency_key
      - relative_path
      - artifact_id
      - content_sha256
    expect:
      bulk_all_owned_supported: false
      maximum_artifacts_removed: 1

  - id: metadata-change-requires-contract-version
    kind: negative
    mutation:
      tool: system_inspect
      description_semantics_changed: true
      contract_version: "1.1"
    expect:
      result: rejected
      error: semantic_change_without_version_change

  - id: stale-retired-name
    kind: negative
    setup:
      retired_tool: probe_result_formats
      host_cache_stale: true
    request:
      tool: probe_result_formats
    expect:
      result: unsupported_operation
      execution_of_replacement: false

  - id: release-provenance-required
    kind: negative
    release_claim: supported
    detached_manifest_digest_present: true
    independent_release_attestation_present: false
    expect:
      release_claim: blocked
      error: release_attestation_missing
