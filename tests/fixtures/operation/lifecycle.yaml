schema_version: "1.1"
contract: OPERATION-LIFECYCLE
contract_version: "1.1.0"

cases:
  - id: received-to-authorised
    kind: positive
    from: received
    to: authorised
    expect:
      allowed: true
      state_version_increases: true

  - id: received-to-running-forbidden
    kind: negative
    from: received
    to: running
    expect:
      allowed: false

  - id: running-to-succeeded
    kind: positive
    from: running
    to: succeeded
    snapshot:
      terminality: terminal
      effect_knowledge: known_effect
      verification_status: verified
      error: null
    expect:
      schema_valid: true

  - id: running-to-uncertain
    kind: positive
    from: running
    to: uncertain
    snapshot:
      terminality: effect_terminal_reconcilable
      effect_knowledge: uncertain
      automatic_retry_allowed: false
      error:
        code: uncertain_outcome
    expect:
      schema_valid: true

  - id: uncertain-automatic-retry-invalid
    kind: negative
    state: uncertain
    retry:
      automatic_retry_allowed: true
    expect:
      schema_valid: false

  - id: uncertain-to-succeeded-after-reconciliation
    kind: positive
    from: uncertain
    to: succeeded
    reconciliation_evidence_present: true
    expect:
      allowed: true

  - id: cancelled-requires-verified-cleanup
    kind: positive
    state: cancelled
    cancellation:
      phase: verified
      remaining_effects_verified: true
    expect:
      schema_valid: true

  - id: cancelled-with-descendants-invalid
    kind: negative
    state: cancelled
    cancellation:
      phase: forced
      remaining_effects_verified: false
    expect:
      schema_valid: false

  - id: failed-requires-error
    kind: negative
    state: failed
    error: null
    expect:
      schema_valid: false

  - id: succeeded-error-invalid
    kind: negative
    state: succeeded
    error:
      code: execution_failed
    expect:
      schema_valid: false

  - id: received-known-effect-invalid
    kind: negative
    state: received
    effect_knowledge: known_effect
    expect:
      schema_valid: false

  - id: failed-uncertain-effect-invalid
    kind: negative
    state: failed
    effect_knowledge: uncertain
    expect:
      schema_valid: false

  - id: progress-unknown-valid
    kind: positive
    progress:
      known: false
      millionths: null
      unit: null
    expect:
      schema_valid: true

  - id: progress-known-valid
    kind: positive
    progress:
      known: true
      millionths: 500000
      unit: operation
    expect:
      schema_valid: true

  - id: progress-overflow-invalid
    kind: negative
    progress:
      known: true
      millionths: 1000001
      unit: operation
    expect:
      schema_valid: false

  - id: progress-known-null-unit-invalid
    kind: negative
    progress:
      known: true
      millionths: 100
      unit: null
    expect:
      schema_valid: false

  - id: state-version-regression
    kind: negative
    previous_state_version: 5
    next_state_version: 4
    expect:
      allowed: false

  - id: status-call-representing-failed-operation
    kind: positive
    tool_call:
      tool: operation_get
      isError: false
      call_status: succeeded
    represented_operation:
      state: failed
    expect:
      valid: true

  - id: status-call-representing-uncertain-operation
    kind: positive
    tool_call:
      tool: operation_get
      isError: false
      call_status: succeeded
    represented_operation:
      state: uncertain
    expect:
      valid: true

  - id: malformed-status-call
    kind: negative
    tool_call:
      tool: operation_get
      arguments:
        operation_id: ""
    expect:
      isError: true
      operation_state_not_fabricated: true
