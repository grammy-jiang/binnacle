schema_version: "1.1"
contract: CAPABILITY-COMPOSITION
policy_version: "1.1.0"

cases:
  - id: command-network-default-deny
    kind: positive
    tool: command_run
    expect:
      network_available: false
      credential_helpers_available: false
      device_access_available: false
      local_control_sockets_available: false

  - id: untrusted-content-to-control-plane
    kind: negative
    source_zone: untrusted-content
    destination_zone: control-plane
    expect:
      result: rejected
      effect_occurred: false

  - id: protected-data-to-model-visible
    kind: negative
    source_zone: protected-data
    destination_zone: model-visible-result
    information_class: restricted-result
    exact_disclosure_contract: false
    expect:
      result: rejected

  - id: prepared-operation-requires-expiry
    kind: negative
    prepared_operation:
      prepared_operation_id: prep-1
      controller_id_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      device_id: pi-a
      tool_name: mediated_http_request
      contract_version: "1.0"
      source_reference_ids: [data-1]
      source_digests:
        - bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      transformation: exact-bytes
      effective_destination:
        scheme: https
        normalized_host: api.example.test
        port: 443
        method: POST
        normalized_path: /upload
      information_class: restricted-result
      maximum_bytes: 1024
      policy_version: "1.1.0"
      profile_version: "1.0.0"
      created_at: "2026-08-08T15:00:00Z"
    expect:
      result: rejected
      error: prepared_operation_expiry_required

  - id: expired-prepared-operation
    kind: negative
    prepared_operation:
      expires_at: "2026-08-08T15:00:00Z"
      policy_version: "1.1.0"
    execution_time: "2026-08-08T15:00:01Z"
    current_policy_version: "1.1.0"
    expect:
      result: prepared_operation_expired
      effect_occurred: false

  - id: policy-version-change-invalidates
    kind: negative
    prepared_operation:
      policy_version: "1.1.0"
      expires_at: "2026-08-08T16:00:00Z"
    current_policy_version: "1.2.0"
    expect:
      result: prepared_operation_stale
      effect_occurred: false

  - id: exact-query-allowed
    kind: positive
    destination_contract:
      scheme: https
      normalized_host: api.example.test
      resolved_ip_ranges: ["203.0.113.0/24"]
      port: 443
      method: GET
      normalized_path: /v1/items
      query_parameter_names: [limit, cursor]
      query_parameter_value_constraints:
        limit:
          integer_min: 1
          integer_max: 100
        cursor:
          pattern: "^[A-Za-z0-9_-]{1,128}$"
    request:
      query_parameters:
        limit: "50"
        cursor: next_1
    expect:
      result: allowed

  - id: allowed-host-query-abuse
    kind: negative
    destination_contract:
      normalized_host: api.example.test
      method: GET
      normalized_path: /v1/items
      query_parameter_names: [limit]
      query_parameter_value_constraints:
        limit:
          integer_min: 1
          integer_max: 100
    request:
      query_parameters:
        limit: "50"
        redirect: https://attacker.example
    expect:
      result: rejected
      error: unlisted_query_parameter

  - id: redirect-destination-substitution
    kind: negative
    prepared_destination:
      normalized_host: api.example.test
      normalized_path: /upload
    response_redirect:
      normalized_host: attacker.example
      normalized_path: /collect
    expect:
      result: rejected
      remote_effect_status: not_sent_to_redirect

  - id: dns-rebinding
    kind: negative
    prepared_destination:
      normalized_host: api.example.test
      resolved_ip_ranges: ["203.0.113.0/24"]
    consequential_boundary_resolution:
      addresses: ["127.0.0.1"]
    expect:
      result: rejected

  - id: forged-provenance
    kind: negative
    model_argument:
      reference_id: data-1
      claimed_provenance: server-observed
    server_record:
      reference_id: data-1
      provenance: external-unverified
    expect:
      effective_provenance: external-unverified
      result: rejected_for_high_risk_composition

  - id: parameter-substitution
    kind: negative
    prepared:
      source_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      maximum_bytes: 1024
    execute:
      source_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      maximum_bytes: 2048
    expect:
      result: prepared_operation_mismatch
      effect_occurred: false

  - id: credential-audience-mismatch
    kind: negative
    credential_contract:
      audience: api.example.test
      action: upload
    request:
      audience: attacker.example
      action: upload
    expect:
      result: rejected
      raw_secret_disclosed: false

  - id: protected-data-laundering
    kind: negative
    chain:
      - source_zone: protected-data
        transformation: base64
        destination_zone: untrusted-content
      - source_zone: untrusted-content
        destination_zone: mediated-egress
    expect:
      information_class_preserved: restricted-result
      result: rejected_without_exact_contract

  - id: normal-result-cross-server-boundary
    kind: positive
    information_class: normal-result
    disclosed_to_model_under_policy: true
    later_host_action: sends_to_other_mcp_server
    expect:
      binnacle_local_enforcement_claim: false
      host_profile_evidence_required: true

  - id: restricted-result-cross-server
    kind: negative
    information_class: restricted-result
    proposed_model_visibility: true
    exact_host_disclosure_contract: false
    expect:
      result: unsupported_host_profile
      data_disclosed: false
