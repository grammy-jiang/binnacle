schema_version: "1.1"
contract: COMMAND-EXECUTION-ISOLATION
policy_version: "1.1.0"

canonical_ticket: &canonical_ticket
  ticket_id: ticket-1
  operation_id: op-1
  controller_id_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  device_id: pi-a
  command_profile_id: workspace-general-v1
  executable_identity: /usr/bin/python3
  argv_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  stdin_sha256: null
  stdin_reference_sha256: null
  workspace_script_sha256: null
  workspace_root_identity: workspace-1
  mount_plan_sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
  environment_sha256: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
  policy_sha256: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
  resource_plan_sha256: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
  sandbox_plan_sha256: 1111111111111111111111111111111111111111111111111111111111111111
  workspace_write_bytes_max: 134217728
  workspace_inode_count_max: 4096
  expires_at: "2026-08-08T16:00:00Z"
  admission_record_id: admission-1
  single_use_nonce: nonce-1

cases:
  - id: canonical-ticket-valid
    kind: positive
    broker_ticket: *canonical_ticket
    expect:
      ticket_schema_valid: true
      broker_accepts_once: true

  - id: ticket-replay
    kind: negative
    broker_ticket: *canonical_ticket
    setup:
      nonce_already_consumed: true
    expect:
      result: rejected
      error: execution_ticket_replayed

  - id: inline-stdin-digest-bound
    kind: positive
    broker_ticket:
      <<: *canonical_ticket
      stdin_sha256: 2222222222222222222222222222222222222222222222222222222222222222
    admission_input:
      stdin_sha256: 2222222222222222222222222222222222222222222222222222222222222222
    expect:
      result: allowed

  - id: inline-stdin-substitution
    kind: negative
    broker_ticket:
      <<: *canonical_ticket
      stdin_sha256: 2222222222222222222222222222222222222222222222222222222222222222
    admission_input:
      stdin_sha256: 3333333333333333333333333333333333333333333333333333333333333333
    expect:
      result: rejected
      error: execution_input_digest_mismatch

  - id: stdin-reference-substitution
    kind: negative
    broker_ticket:
      <<: *canonical_ticket
      stdin_reference_sha256: 4444444444444444444444444444444444444444444444444444444444444444
    admission_input:
      stdin_reference_sha256: 5555555555555555555555555555555555555555555555555555555555555555
    expect:
      result: rejected
      error: execution_input_digest_mismatch

  - id: workspace-script-substitution
    kind: negative
    broker_ticket:
      <<: *canonical_ticket
      workspace_script_sha256: 6666666666666666666666666666666666666666666666666666666666666666
    admission_input:
      workspace_script_sha256: 7777777777777777777777777777777777777777777777777777777777777777
    expect:
      result: rejected
      error: execution_input_digest_mismatch

  - id: workspace-check-profile-consistent
    kind: positive
    profile: workspace-check-v1
    expect:
      command_run_visible: true
      command_run_allowed: true
      network_default: denied
      device_default: denied
      raw_credentials: denied

  - id: self-management-hidden
    kind: positive
    profile: self-management
    expect:
      command_run_visible: false
      command_run_allowed: false
      dedicated_self_management_tools_required: true

  - id: per-file-limit-not-aggregate-quota
    kind: negative
    setup:
      per_file_size_max: 16777216
      workspace_write_bytes_max: null
      workspace_inode_count_max: null
    workload:
      files_created: 10000
      bytes_per_file: 1048576
    expect:
      profile_valid: false
      error: aggregate_workspace_quota_missing

  - id: aggregate-workspace-byte-limit
    kind: positive
    limits:
      workspace_write_bytes_max: 134217728
      workspace_inode_count_max: 4096
    workload:
      attempted_total_bytes: 134217729
    expect:
      process_tree_stopped_or_write_rejected: true
      host_filesystem_limit_exceeded: false

  - id: aggregate-workspace-inode-limit
    kind: positive
    limits:
      workspace_inode_count_max: 4096
    workload:
      attempted_file_count: 4097
    expect:
      process_tree_stopped_or_create_rejected: true

  - id: control-plane-read
    kind: negative
    request:
      path: /var/lib/binnacle/policy
    expect:
      result: denied
      data_disclosed: false

  - id: inherited-local-socket
    kind: negative
    setup:
      parent_has_unix_socket: true
    executor:
      inherited_descriptors: []
    expect:
      socket_available: false

  - id: ipv4-egress
    kind: negative
    command:
      argv: [python3, -c, "import socket; socket.create_connection(('203.0.113.1',443))"]
    expect:
      network_connection_established: false

  - id: ipv6-egress
    kind: negative
    command:
      argv: [python3, -c, "import socket; socket.socket(socket.AF_INET6)"]
    expect:
      network_connection_established: false

  - id: device-node-access
    kind: negative
    request:
      path: /dev/gpiomem
    expect:
      result: denied

  - id: fork-bomb-contained
    kind: negative
    workload:
      descendant_count_attempted: 10000
    limits:
      pids_max: 256
    expect:
      maximum_descendants: 256
      cleanup_verifies_all_descendants: true

  - id: daemonization-does-not-escape
    kind: negative
    workload:
      double_fork: true
      new_process_group: true
    expect:
      descendant_remains_accounted: true
      cleanup_verifies_all_descendants: true

  - id: cleanup-failure-not-cancelled
    kind: negative
    cancellation:
      requested: true
      descendants_remaining: 1
    expect:
      operation_state: uncertain
      verified_cancelled: false

  - id: direct-subprocess-fallback-forbidden
    kind: negative
    setup:
      sandbox_control_unavailable: true
    expect:
      command_run_supported: false
      subprocess_started: false
