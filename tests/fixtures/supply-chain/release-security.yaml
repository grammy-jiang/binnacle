schema_version: "1.1"
contract: RELEASE-SUPPLY-CHAIN
contract_version: "1.1.0"

cases:
  - id: detached-payload-digest
    kind: positive
    envelope:
      payload_contains_payload_sha256: false
      payload_contains_signatures: false
      integrity_contains_payload_sha256: true
      integrity_contains_signatures: true
      canonicalization: rfc8785-jcs
    expect:
      self_reference: false
      verifier_reproduces_payload_digest: true

  - id: payload-self-referential-digest
    kind: negative
    envelope:
      payload:
        manifest_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    expect:
      schema_valid: false
      error: digest_inside_authenticated_payload

  - id: source-branch-without-commit
    kind: negative
    source:
      repository: https://github.com/grammy-jiang/binnacle
      branch: master
      commit_sha: null
    expect:
      release_supported: false

  - id: unpinned-mcp-sdk
    kind: negative
    component:
      name: mcp-python-sdk
      kind: mcp-sdk
      version: ">=2"
      artifact_sha256: null
      hosted_service: false
    expect:
      schema_or_policy_valid: false

  - id: three-sbom-documents-present
    kind: positive
    sboms:
      - document_type: source_build
        format: spdx-json
      - document_type: runtime
        format: cyclonedx-json
      - document_type: deployed_inventory
        format: binnacle-inventory-json
    expect:
      policy_valid: true

  - id: deployed-inventory-missing
    kind: negative
    sboms:
      - document_type: source_build
      - document_type: runtime
    expect:
      schema_valid: false
      release_supported: false

  - id: duplicate-runtime-sbom
    kind: negative
    sboms:
      - document_type: source_build
      - document_type: runtime
      - document_type: runtime
      - document_type: deployed_inventory
    expect:
      schema_valid: false

  - id: security-exception-complete
    kind: positive
    exception:
      exception_id: exception-1
      finding_ids: [CVE-TEST-1]
      affected_builds: [build-1]
      affected_profiles: [raspberry-pi-os-bookworm-arm64]
      affected_components: [mcp-sdk]
      exploitability_analysis: The vulnerable path is not reachable in the enabled profile.
      exposure_analysis: Network access is disabled for the affected component.
      accepted_residual_risk: Local authenticated denial of service remains possible.
      reason: Temporary exception while the upstream fix is validated.
      owner: owner
      approver: owner
      remediation_owner: maintainer
      monitoring_controls:
        - alert if the vulnerable code path becomes enabled
      forced_retirement_triggers:
        - retire immediately if public exploitation is observed
      created_at: "2026-08-08T15:00:00Z"
      remediation_deadline: "2026-08-15T15:00:00Z"
      expires_at: "2026-08-15T15:00:00Z"
      status: active
    expect:
      schema_valid: true

  - id: exception-missing-exploitability
    kind: negative
    based_on: security-exception-complete
    mutation:
      remove: exception.exploitability_analysis
    expect:
      schema_valid: false

  - id: exception-missing-exposure
    kind: negative
    based_on: security-exception-complete
    mutation:
      remove: exception.exposure_analysis
    expect:
      schema_valid: false

  - id: exception-missing-remediation-owner
    kind: negative
    based_on: security-exception-complete
    mutation:
      remove: exception.remediation_owner
    expect:
      schema_valid: false

  - id: exception-missing-monitoring
    kind: negative
    based_on: security-exception-complete
    mutation:
      set:
        exception.monitoring_controls: []
    expect:
      schema_valid: false

  - id: exception-missing-retirement-trigger
    kind: negative
    based_on: security-exception-complete
    mutation:
      set:
        exception.forced_retirement_triggers: []
    expect:
      schema_valid: false

  - id: expired-exception-does-not-pass-gate
    kind: negative
    exception:
      status: expired
      expires_at: "2026-08-07T15:00:00Z"
    evaluation_time: "2026-08-08T15:00:00Z"
    expect:
      gate_outcome: failed

  - id: reproducibility-overclaim
    kind: negative
    evidence:
      resolved_inputs: true
      same_builder_rebuild_match: false
      independent_rebuild_match: false
    claimed_level: RB3
    expect:
      release_supported: false
      maximum_claimable_level: RB1

  - id: hosted-tunnel-service-honest-evidence
    kind: positive
    component:
      name: secure-mcp-tunnel
      kind: tunnel-agent
      hosted_service: true
      artifact_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      external_service_evidence:
        service_identity: OpenAI Secure MCP Tunnel service
        region_or_tenant: null
        observed_at: "2026-08-08T15:00:00Z"
        evidence_ref: tunnel-evidence-1
        residual_risk: Hosted service internals and deployment digest are not independently visible.
        fallback: Disable the connection and retain local Binnacle state.
    expect:
      fabricated_service_digest_present: false
      policy_valid: true

  - id: install-artifact-digest-mismatch
    kind: negative
    envelope_artifact_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    installed_artifact_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    expect:
      installation_allowed: false

  - id: startup-deployed-inventory-drift
    kind: negative
    release_inventory_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    observed_inventory_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    expect:
      startup_mode: restricted
      affected_capabilities_enabled: false

  - id: update-crash-before-activation
    kind: positive
    fault_point: stage_after_verification_before_activation
    expect:
      active_release_unchanged: true
      rollback_not_required: true

  - id: update-crash-after-activation
    kind: negative
    fault_point: after_activation_before_post_check
    post_activation_health: failed
    expect:
      rollback_attempted: true
      audit_continuity_preserved: true
      idempotency_records_preserved: true

  - id: migration-failure
    kind: negative
    stage: isolated_migration_and_checks
    result: failed
    expect:
      active_release_unchanged: true
      staged_release_discarded_or_quarantined: true

  - id: forced-retirement
    kind: positive
    build_state: forced-retired
    expect:
      new_consequential_work: blocked
      bounded_status_and_recovery: available
      recovery_evidence_preserved: true
