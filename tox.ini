; tox with the tox-uv plugin: each env is created and synced by uv from
; uv.lock (uv-venv-lock-runner), so every Python version tests against the
; same locked dependency set. Interpreters other than the system 3.13 are
; standalone builds that uv downloads on first run.
[tox]
env_list = py310, py311, py312, py313, py314

[testenv]
runner = uv-venv-lock-runner
dependency_groups = test
commands = python -m pytest tests/ -q {posargs}
